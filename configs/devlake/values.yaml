# ExternalSecret refreshInterval, pinned explicitly to the chart's current built-in
# values (no behaviour change). Tune per fleet here. Keys: devlake chart values.yaml.
externalSecrets:
  refreshInterval: 1h           # devlake-encryption-secret, mysql-passwords
  devlakeMysqlAuth:
    refreshInterval: 1m
pushSecrets:
  mysqlEndpointPush:
    refreshInterval: 30s        # PushSecret, bootstrap

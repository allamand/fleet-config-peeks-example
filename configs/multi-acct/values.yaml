# ACK CARM (Cross-Account Resource Management) for the HUB only.
#
# The multi-acct chart renders the hub's own Namespace and IAMRoleSelectors (the
# <resourcePrefix>-cluster-mgmt-<svc> roles ACK assumes on the hub). Spoke coverage
# is NOT configured here: each spoke's IAMRoleSelectors are rendered by its own
# clusters-kro-<spoke> Application (kro-clusters chart), from the spoke declaration
# in fleet/spoke-values/. Spoke keys in this map are ignored.
#
# Read at repo ROOT by the appset-chart external per-addon overlay tier
# ($overlay/configs/multi-acct/values.yaml), NOT under gitops/.
#
# The only key the chart reads is the hub's own cluster name, to pin a different
# account for the hub. Leave it empty to use the hub's own account (default):
#
#   clusters:
#     <hub-cluster-name>: "<account-id>"
#
# PUBLIC-REPO / ZERO-SECRET: no account ID is committed here.
clusters: {}

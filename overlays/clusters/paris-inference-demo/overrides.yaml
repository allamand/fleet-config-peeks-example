      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: peeks-paris
            orgId: 1
            folder: PEEKS Paris
            type: file
            # Suppression et édition laissées possibles : pendant la
            # répétition du 10/11, on veut pouvoir corriger un panneau à
            # chaud sans attendre un cycle GitOps. Argo CD rétablira le
            # fichier au sync suivant.
            disableDeletion: false
            editable: true
            options:

# ═════════════════════════════════════════════════════════════════════════════
#  CHEMIN DANS LA BRANCHE : overlays/clusters/paris-inference-demo/overrides.yaml
#
#  Lu par l'appset `cluster-addons` au slot $overlay, EN DERNIER de ses
#  valueFiles (gitops/bootstrap/addons.yaml l.64), donc il gagne sur tout.
#
#  POURQUOI AU NIVEAU **CLUSTER** — CORRECTION DE CETTE PASSE :
#  ce repo sert DÉJÀ peeks-a-hub et peeks-b-hub. Sébastien l'écrit lui-même dans
#  overlays/clusters/peeks-a-hub/overrides.yaml : « Do NOT move this entry to
#  overlays/environments/control-plane/overrides.yaml: both hubs read that file ».
#  Mes entrées posées au niveau environment auraient atterri sur les deux hubs.
#
#  PRÉCÉDENT QUI VALIDE TOUT CE FICHIER : commit 4606bdf du 2026-10-30,
#  « feat(peeks-a-hub): add aiops-agent registry entry in the cluster overrides ».
#  Message de Sébastien : « no registry entry introduces the aiops-agent
#  ApplicationSet. Add the entry in overlays/clusters/peeks-a-hub/overrides.yaml,
#  the last valueFile of this hub's cluster-addons, so only this hub gets it. »
#  => Ajouter une ENTRÉE DE REGISTRE depuis l'overlay est un mécanisme ÉPROUVÉ
#     dans ce repo, pas une acrobatie. C'est ce qui rend le cas B de KEDA sûr.
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# LA NODECLASS — servie depuis CETTE branche d'overlay
#
# POURQUOI cet addon existe : le chart platform-manifests-bootstrap n'a AUCUN
# point d'injection de NodeClass (3 templates, aucun ne rend de NodeClass), et
# rien dans gitops/ n'en rend. Il faut donc un autre véhicule.
#
# Véhicule : `repoURLGit` est surchargeable PAR ADDON — son défaut
# (`{{.metadata.annotations.addonsRepoURL}}`) est posé dans
# gitops/addons/registry/_defaults.yaml l.27, et le template de l'appset-chart
# l.143 utilise bien `$repoURLGit` pour la source de l'Application. En le
# surchargeant vers le repo de fleet-config, l'Application sert les manifestes
# bruts de cette branche.
#
# ⚠️ NON VÉRIFIABLE SANS CLUSTER — c'est le principal risque résiduel de cette
# pièce : je n'ai pas pu confirmer que l'appset-chart gère un `path` pointant un
# répertoire de manifestes BRUTS (ArgoCD le fait nativement, mais le chart
# ajoute peut-être toujours un bloc `helm:`).
# REPLI si ça ne rend pas : appliquer la NodeClass une fois à la main
#   kubectl apply -f manifests/gpu-nodeclass/nodeclass.yaml
# Aucun contrôleur ne la possède, donc rien ne la revertira. Hors GitOps, mais
# c'est UN objet, idempotent, et ça ne bloque pas la démo.
#
# ⏳ rc8 — si rc8 a ajouté un template NodeClass au chart, supprimer cet addon
# et repasser par une valeur de chart : ce serait plus propre.
# ─────────────────────────────────────────────────────────────────────────────
gpu-nodeclass-peeks:
  namespace: kube-system
  # Surcharge de la source vers CETTE branche d'overlay.
  repoURLGit: https://github.com/allamand/fleet-config-peeks-example
  repoURLGitRevision: demo/paris-2026-11-17
  repoURLGitBasePath: ""
  path: manifests/gpu-nodeclass
  annotationsAppSet:
    # Wave -2 : la NodeClass doit EXISTER avant que les NodePools la référencent
    # (custom-nodepools est rendu par platform-manifests-bootstrap, wave par
    # défaut 0). Un NodePool qui référence une NodeClass absente reste
    # NotReady et ne provisionne rien.
    argocd.argoproj.io/sync-wave: "-2"
  selector:
    matchExpressions:
      - key: enable_platform_manifests_bootstrap
        operator: In
        values: ["true"]
        # Réutilise l'interrupteur du chart qui porte les NodePools : la
        # NodeClass et les pools vont toujours ensemble, donc un seul
        # interrupteur évite un état incohérent.

# ─────────────────────────────────────────────────────────────────────────────
# KEDA — UNE SEULE VOIE : L'OVERLAY DÉFINIT L'ADDON. (le « cas A » est mort)
#
# J'avais écrit deux cas, dont un « cas A » où une seule ligne `keda: true`
# suffirait si une release amont avait mergé origin/feature/agentic-addons.
# CE CAS N'EXISTE PAS, et c'est tranché, pas supposé :
#   · KEDA est ABSENT de `main` ET de `v0.4.0-rc7` — vérifié moi-même :
#       git grep -l -i keda origin/main  -- gitops/  -> 0 fichier
#       git grep -l -i keda v0.4.0-rc7   -- gitops/  -> 0 fichier
#       git grep -l -i keda origin/feature/agentic-addons -- gitops/ -> 2
#   · et `feature/agentic-addons` a 10 commits d'avance sur main pour **1165 de
#     retard**, sans PR ouverte : elle ne sera pas fusionnée en l'état.
# => Aucune release ne nous apportera KEDA. L'overlay DOIT le définir, et c'est
#    sûr parce qu'il passe EN DERNIER (addons.yaml l.63-64), donc il peut
#    DÉFINIR un addon et pas seulement le basculer — précédent `4606bdf`.
#
# ET LA BRANCHE EST UNE RÉFÉRENCE À LIRE, PAS UNE SOURCE À RECOPIER : avec 1165
# commits de retard, son `values.yaml` est périmé. J'y ai pris les seules choses
# stables — chartName, chartRepository, namespace, wave, nom du selector — et
# j'ai VALIDÉ le reste contre le VRAI chart téléchargé
# (kedacore.github.io/charts, keda-2.19.0.tgz, values.yaml lu). C'est ce qui a
# fait apparaître l'erreur de forme corrigée ci-dessous sur `serviceAccount`.
# ─────────────────────────────────────────────────────────────────────────────
keda:
  namespace: keda                                      # = art antérieur
  chartName: keda                                      # = art antérieur
  releaseName: keda                                    # = art antérieur
  chartRepository: https://kedacore.github.io/charts    # = art antérieur
  defaultVersion: "2.19.0"
  # POURQUOI 2.19.0 et pas 2.21.0 : les deux sont publiées (index du dépôt lu le
  # 2026-11-04 : 2.21.0, 2.20.2, 2.20.1, 2.20.0, 2.19.0, 2.18.x…), et s'aligner
  # sur la version qu'un auteur PEEKS avait déjà retenue vaut mieux que prendre
  # la plus récente du jour. SURTOUT : c'est la version dont j'ai réellement lu
  # le `values.yaml`, donc la seule contre laquelle les valeurs ci-dessous sont
  # vérifiées. CE QUI CASSE si on monte : revalider la forme de `serviceAccount`
  # et `resources` sur la nouvelle version avant de changer ce champ.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
    # POURQUOI wave 3 : c'est celle que .kiro/skills/manage-addons/references/
    # sync-waves.md RÉSERVE explicitement à keda, aux côtés de
    # kube-state-metrics, prometheus-node-exporter et opentelemetry-operator.
  selector:
    matchExpressions:
      - key: enable_keda
        operator: In
        values: ["true"]
  valuesObject:
    # ═══════════════════════════════════════════════════════════════════════
    # 🎯 ÉPINGLAGE — `managed-by: peeks` AJOUTÉ le 2026-11-05.
    #    C'est le 3e pied du trépied, et l'INVERSE EXACT de ce qu'on avait fait
    #    cette nuit : on retirait le sélecteur, il fallait le rendre PLUS
    #    SPÉCIFIQUE.
    #
    # POURQUOI `node-type` SEUL NE SUFFIT PAS. Deux pools non taintés le portent
    # désormais, et un seul protège :
    #   platform-general      budget [{nodes: "10%"}] SANS schedule -> jamais bloquant
    #   general-purpose-peeks budget [{nodes:"0", schedule:"0 3 * * *", 23h}] -> 23h bloquées
    # Seul `general-purpose-peeks` porte AUSSI `managed-by: peeks`. La paire de
    # labels le désigne donc sans ambiguïté.
    #
    # ET LE `weight: 100` NE SUFFIT PAS NON PLUS — c'est la mesure qui a tranché.
    # Le poids de Karpenter n'arbitre QU'AU PROVISIONNEMENT. Un pod qui redémarre
    # produit un événement de PLANIFICATION, que kube-scheduler résout sur la
    # capacité EXISTANTE, sans jamais consulter le poids. Relevé à 09:40Z : les
    # 3 pods KEDA étaient sur `platform-general`, donc SANS fenêtre, et ils y
    # seraient restés. Le poids décide où l'on CRÉE un nœud, pas où l'on place
    # un pod.
    #
    # LE WEBHOOK VIENT EN PASSANT, et ce n'est pas un choix. Le chart KEDA n'a
    # qu'un `nodeSelector` PLAT (`.Values.nodeSelector`, utilisé 3 fois dans
    # deployment.yaml) : il n'existe aucune variante par composant, contrairement
    # à `podAnnotations` qui l'est. Les 3 pods sont donc épinglés ensemble.
    # `keda-admission-webhooks` n'a aucun besoin de la fenêtre — il ne valide que
    # les écritures de ScaledObject, et rien n'écrit pendant la démo — mais
    # l'embarquer coûte 100m/100Mi sur un nœud qui a 2620m de libre, et un
    # redémarrage de 20 s. Moins cher que de forker le chart.
    #
    # COÛT TOTAL : zéro nœud. Les 3 pods KEDA plus Grafana totalisent ~200m CPU
    # et ~512Mi, et le nœud `general-purpose-peeks` (c7i-flex.xlarge) a 3770m
    # allouables dont 1150m utilisés. Il existait déjà et était quasi vide — la
    # fenêtre interdisant de le reprendre, il coûtait 61 $ jusqu'au 18 à ne rien
    # faire. L'épinglage ne l'ajoute pas, il le rend utile.
    # ═══════════════════════════════════════════════════════════════════════
    nodeSelector:
      node-type: general-purpose
      managed-by: peeks
      # POURQUOI : les trois pools d'inférence sont taintés nvidia.com/gpu, et
      # l'opérateur KEDA n'a rien à faire sur un nœud GPU. `general-purpose` est
      # le label que porte le pool general-purpose-peeks de PEEKS.
      # CE QUI CASSE : sans ça, l'opérateur peut rester Pending si le pool
      # général intégré a été retiré (enableGeneralPurposeNodePool="false").
    # ⚠️ CORRECTION DE FORME — MÊME CLASSE DE BOGUE QUE `customNodeClasses`.
    # J'avais écrit `serviceAccount: { create: true, name: keda-operator }`.
    # **CETTE FORME N'EXISTE PAS DANS LE CHART.** Lecture du vrai values.yaml de
    # keda-2.19.0 : `serviceAccount` est nesté PAR COMPOSANT —
    #     serviceAccount:
    #       operator:      { create: true, name: keda-operator,        ... }
    #       metricServer:  { create: true, name: keda-metrics-server,  ... }
    #       webhooks:      { create: true, name: keda-webhook,         ... }
    # Mes deux clés auraient été ajoutées à côté et IGNORÉES en silence.
    # Par chance le défaut du chart est DÉJÀ `keda-operator`, donc l'association
    # Pod Identity aurait fonctionné — par accident, pas par conception.
    #
    # ✅ ET ÇA FERME L'INCONNUE DE DESIGN.md §4.4 SANS CLUSTER : le nom du SA de
    # l'opérateur est `keda-operator`, lu dans le chart. L'association Pod
    # Identity (DESIGN.md §4.3) référence le bon nom. Le `kubectl -n keda get sa`
    # reste un contrôle de confirmation, plus une inconnue bloquante.
    serviceAccount:
      operator:
        create: true
        name: keda-operator

    # `podIdentity.aws.irsa` DOIT RESTER À false (son défaut) : nous utilisons
    # **EKS Pod Identity**, pas IRSA (DESIGN.md §4.1), et Pod Identity ne demande
    # AUCUNE configuration côté chart — l'association est posée côté AWS.
    # Explicite pour empêcher qu'on « aide » en activant IRSA, ce qui ferait
    # monter un token projeté inutile et masquerait la vraie identité.
    podIdentity:
      aws:
        irsa:
          enabled: false
    resources:
      operator:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 512Mi }
      metricServer:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 512Mi }

    # ═════════════════════════════════════════════════════════════════════════
    # 📊 MÉTRIQUES PROMETHEUS DE L'OPÉRATEUR — ACTIVÉES le 2026-11-05
    #
    # LE DÉFAUT : l'opérateur tournait avec `--enable-prometheus-metrics=false`,
    # donc AUCUNE métrique `keda_*` n'existait. Mesuré : l'endpoint
    # `keda-operator-metrics-apiserver:8080` rend 257 Ko, mais ce sont 792 lignes
    # `apiserver_*`, 422 `go_*` et 310 `workqueue_*` — c'est le serveur
    # d'API agrégé, pas l'opérateur. Zéro série `keda_*`. Un dashboard KEDA
    # aurait donc été vide de façon STRUCTURELLE, et pas « en attente du 10/11 ».
    #
    # LA CLÉ, vérifiée dans le chart RÉELLEMENT épinglé (keda 2.19.0 téléchargé,
    # Chart.yaml version=2.19.0 appVersion=2.19.0), templates ET values :
    #   templates/manager/deployment.yaml:98
    #     - "--enable-prometheus-metrics={{ .Values.prometheus.operator.enabled }}"
    #   templates/manager/deployment.yaml:99-100
    #     {{- if .Values.prometheus.operator.enabled }}
    #     - "--metrics-bind-address=:{{ .Values.prometheus.operator.port }}"
    #   values.yaml : prometheus.operator.enabled = False, port = 8080
    #
    # ⚠️ LE PORT N'EST PAS 9666. Avant ce correctif le conteneur ne déclarait que
    # `('metricsservice', 9666)`, qui est le canal gRPC vers le metrics-apiserver
    # — rien à voir avec Prometheus. Les métriques `keda_*` sortent sur le port
    # de `prometheus.operator.port`, soit 8080, posé par `--metrics-bind-address`.
    #
    # Et le rendu local a corrigé une hypothèse que j'avais écrite ici : la clé
    # ne pose pas seulement le flag, elle fait AUSSI déclarer le port. Le
    # `helm template` du chart épinglé donne
    #   ports : [('metrics', 8080), ('metricsservice', 9666)]
    # là où le défaut ne donnait que le second. Le port est donc nommé et
    # scrapable, ce qui est mieux qu'un port implicite joignable seulement par
    # l'IP du pod.
    #
    # serviceMonitor laissé à false : il n'y a pas de prometheus-operator ici,
    # et le collecteur AMP managé ne lit pas les ServiceMonitor (cf. AUDIT §4.2).
    # Le scrape viendra du Scraper AMP, configuré ailleurs.
    prometheus:
      operator:
        enabled: true
        port: 8080

  # ═══════════════════════════════════════════════════════════════════════════
  # 🔧 CORRECTIF CRD — `ServerSideApply=true`, AJOUTÉ le 2026-11-05
  #
  # LE DÉFAUT : la CRD `scaledjobs.keda.sh` n'est JAMAIS créée. 5 CRD sur 6
  # seulement, et `keda-operator` reste en CrashLoopBackOff sur un type non
  # reconnu.
  #
  # MESURÉ sur l'Application `keda-paris-inference-demo` le 2026-11-05 à 18:08Z
  # — et ceci CORRIGE une note antérieure qui disait « le sync échoue en bloc » :
  #   ressources en echec : 1 / 29
  #   phase=Running  "Retrying attempt #54"  sync=OutOfSync  health=Progressing
  #   CustomResourceDefinition "scaledjobs.keda.sh" is invalid:
  #     metadata.annotations: Too long: may not be more than 262144 bytes
  # 28 ressources sur 29 sont donc bien appliquées ; SEULE la CRD échoue, et
  # l'Application retente indéfiniment (`retry.limit: -1`). L'Application n'est
  # pas bloquée en entier — c'est l'opérateur qui est inutilisable, faute du
  # type `ScaledJob` :
  #   "no matches for kind \"ScaledJob\" in version \"keda.sh/v1alpha1\""
  #   keda-operator-798fc9b664-vbpqj  0/1  CrashLoopBackOff  75 redemarrages
  #
  # LA CAUSE, mesurée : le défaut du chart (appset-chart/values.yaml:18-19) ne
  # porte que `CreateNamespace=true`. L'apply est donc côté CLIENT, et écrit
  # l'annotation `kubectl.kubernetes.io/last-applied-configuration`, plafonnée
  # à 262 144 octets. `ServerSideApply` n'écrit pas cette annotation — c'est le
  # seul levier, pas un réglage de confort.
  # Défaut amont connu : kedacore/keda#4740.
  #
  # LA PREUVE CAUSALE, mesurée le 2026-11-05 sur le chart keda 2.19.0 réellement
  # téléchargé : des 6 CRD, UNE SEULE dépasse la limite, et c'est exactement
  # celle qui manque.
  #     662 483  crd-scaledjobs.yaml                      <<< > 262 144
  #      23 158  crd-clustertriggerauthentications.yaml
  #      23 021  crd-triggerauthentications.yaml
  #      22 154  crd-scaledobjects.yaml
  #       7 555  crd-cloudeventsources.yaml
  #       7 487  crd-clustercloudeventsources.yaml
  # Les 5 autres sont 11 à 35 fois sous la limite — d'où « 5 CRD sur 6 ».
  #
  # ⚠️ CETTE CLÉ REMPLACE LE `syncPolicy` PAR DÉFAUT EN ENTIER, ELLE NE LE
  # FUSIONNE PAS. Vérifié dans le template : appset-chart/templates/
  # application-set.yaml:202-208 est un `if $chartConfig.syncPolicy / else`,
  # donc tout ce qui n'est pas réécrit ici serait PERDU. `automated` et `retry`
  # sont donc redonnés À L'IDENTIQUE du défaut lu dans values.yaml:4-19 —
  # ne pas les « simplifier », ce serait une régression silencieuse.
  #
  # UN SEUL LEVIER À LA FOIS : ne rien pousser d'autre dans le même commit,
  # sinon on ne saura pas lequel a installé la CRD.
  #
  # SI ÇA NE SUFFIT PAS : `Replace=true` au lieu de `ServerSideApply=true`.
  # Même effet sur l'annotation, mais remplacement non fusionnant — plus
  # brutal, à ne tenter qu'en second.
  #
  # RETOUR ARRIÈRE : révoquer le commit ; `selfHeal: true` ramène l'Application
  # à l'état d'avant. La CRD déjà posée SURVIT (`prune: false`), ce qui est sans
  # danger — une CRD sans CR ne fait rien — et se retire au besoin par
  # `kubectl delete crd scaledjobs.keda.sh` APRÈS avoir vérifié qu'aucun
  # ScaledJob n'existe.
  # ═══════════════════════════════════════════════════════════════════════════
  syncPolicy:
    automated:                 # ↓ identique à appset-chart/values.yaml:5-11
      selfHeal: true
      allowEmpty: true
      prune: false
    retry:                     # ↓ identique à appset-chart/values.yaml:12-17
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true   # ← le défaut, conservé
      - ServerSideApply=true   # ← LE SEUL AJOUT RÉEL de ce bloc

# ─────────────────────────────────────────────────────────────────────────────
# GRAFANA — NOTRE PROPRE ADDON, DEPUIS LE CHART UPSTREAM
#
# POURQUOI pas l'addon `grafana` de PEEKS : son chart n'a que QUATRE valeurs et
# n'en référence qu'UNE. Son `grafana.ini` est figé (`disable_login_form =
# false`, pas de `[auth.generic_oauth]`), son `env:` est explicite donc pas
# d'`envFrom`, et son Ingress est rendu SANS garde `enabled`. Il est donc
# impossible, PAR VALEURS, de lui mettre de l'OIDC ou de lui retirer son
# ingress. Toute clé qu'on y poserait serait un no-op silencieux.
#
# CE QUE CE BLOC DONNE : Grafana tourne, Sébastien le voit, et RIEN n'est
# public. Mêmes mécanique et véhicule que KEDA — une entrée de registre que
# l'overlay apporte, l'overlay passant en dernier.
#
# TOUTES LES CLÉS CI-DESSOUS SONT VÉRIFIÉES dans le values.yaml du chart
# upstream grafana/grafana 10.5.15 (téléchargé et lu) : `service`, `ingress`,
# `grafana.ini`, `datasources`, `serviceAccount`, `admin`, `persistence`,
# `nodeSelector`, `tolerations`, `resources`.
# ─────────────────────────────────────────────────────────────────────────────
grafana-paris:
  namespace: grafana-paris
  chartName: grafana
  releaseName: grafana-paris
  chartRepository: https://grafana.github.io/helm-charts
  defaultVersion: "10.5.15"
  # Dernière version publiée au 2026-11-04, et la seule dont j'ai lu le
  # values.yaml — donc la seule contre laquelle ces clés sont vérifiées.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
  selector:
    matchExpressions:
      - key: enable_grafana_paris
        operator: In
        values: ["true"]
  valuesObject:
    # ═══ LA RAISON D'ÊTRE DE CE BLOC : AUCUNE EXPOSITION ═══
    ingress:
      enabled: false
      # Déjà le défaut du chart, posé EXPLICITEMENT : un défaut d'exposition ne
      # se laisse pas implicite dans un fichier qu'on relit avant de montrer
      # quelque chose à des clients. Pas d'Ingress -> pas de chemin sur l'ALB ->
      # pas d'URL CloudFront -> rien de public.
    service:
      type: ClusterIP
      port: 80
      # Idem : défaut du chart, rendu explicite.
    # Accès : `kubectl -n grafana-paris port-forward svc/grafana-paris 3000:80`
    # donc à travers l'endpoint EKS, authentifié en IAM.

    persistence:
      enabled: false
      # Démo éphémère : rien à conserver, et ça évite un EBS de plus à balayer
      # au teardown.

    admin:
      existingSecret: ""
      # Vide = le chart génère lui-même un mot de passe admin ALÉATOIRE dans un
      # Secret. On ne fixe AUCUN mot de passe dans ce fichier — un identifiant
      # en clair dans un livrable est exclu. Le récupérer le jour J :
      #   kubectl -n grafana-paris get secret grafana-paris \
      #     -o jsonpath='{.data.admin-password}' | base64 -d
      # ⚠️ Ce compte local est acceptable ICI et SEULEMENT ici parce que le
      # service n'est pas exposé : la porte d'entrée réelle est l'endpoint EKS
      # (IAM + access entry). Le même compte derrière une URL CloudFront
      # publique serait inacceptable — c'est précisément pourquoi l'addon
      # `grafana` de PEEKS reste à `false`.

    grafana.ini:
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
        # EXPLICITE : l'accès anonyme est refusé. C'est la clé que la
        # vérification de sortie (EXPOSURE.md §1.2) doit prouver.
      # ═══════════════════════════════════════════════════════════════════════
      # 🔑 SIGV4 DOIT ÊTRE ACTIVÉ GLOBALEMENT — AJOUTÉ le 2026-11-05
      #
      # LE DÉFAUT : la datasource portait bien `sigV4Auth: true`, le rôle IAM et
      # la pod identity association étaient en place, le token était injecté
      # (`eks-pod-identity-token`, `AWS_CONTAINER_CREDENTIALS_FULL_URI`) — et la
      # requête rendait quand même :
      #   HTTP 403  {"message":"Missing Authentication Token"}
      # C'est la réponse d'AWS à une requête NON SIGNÉE : Grafana n'appliquait
      # pas SigV4 du tout.
      #
      # LA CAUSE : `jsonData.sigV4Auth` d'une datasource est IGNORÉ tant que
      # SigV4 n'est pas activé au niveau du serveur. Lu directement dans le
      # `defaults.ini` du conteneur (Grafana 12.3.1), et non dans une
      # documentation :
      #   [auth]  sigv4_auth_enabled = false
      #           # Set to true to enable SigV4 authentication option for
      #           # HTTP-based datasources
      #   [auth]  sigv4_verbose_logging = false
      # Le `grafana.ini` en vigueur ne portait AUCUNE mention de sigv4, et la
      # section `[auth]` n'existait même pas — seulement `[auth.anonymous]`,
      # qui est une section distincte malgré le préfixe commun.
      #
      # Noter la forme : `auth:` et `auth.anonymous:` sont deux clés YAML
      # SŒURS, qui produisent deux sections ini différentes. Imbriquer
      # `anonymous` sous `auth` donnerait `[auth] anonymous.enabled`, ce qui ne
      # désactiverait plus l'accès anonyme — donc on ne regroupe pas.
      auth:
        sigv4_auth_enabled: true

    # La source de données AMP, en SigV4.
    #
    # ⬛ `<WS_ID>` SUBSTITUÉ le 2026-11-05. Le placeholder n'avait jamais été
    # remplacé, donc l'URL de la datasource était littéralement invalide : même
    # avec une authentification en place, aucune requête n'aurait abouti. Le
    # `# ⏳ cluster` qui marquait cette ligne attendait un relevé sur le cluster,
    # et le voici.
    #
    # Relevé par `aws amp list-workspaces --region eu-west-3` :
    #   ws-294f5b5c-de0f-497b-ab57-d13f3fb2736d
    #   alias  demo-paris-b-observability-amp
    #   état   ACTIVE
    #   arn    arn:aws:aps:eu-west-3:<compte>:workspace/ws-294f5b5c-…
    # Confirmé côté cluster par la CR `workspace.amp.aws.upbound.io/demo-paris-b-amg`,
    # dont le champ d'id porte la même valeur, `True True` depuis 23 h.
    #
    # ⚠️ L'AUTHENTIFICATION MANQUE ENCORE, et ce n'est pas réparable ici.
    # `sigV4AuthType: default` demande à Grafana la chaîne de credentials du SDK
    # AWS. Le pod n'en a aucune : pas de pod identity pour ce namespace (0 sur
    # les 16 du cluster), pas d'annotation `eks.amazonaws.com/role-arn` sur le
    # ServiceAccount, aucun volume `aws-iam-token`, aucune variable `AWS_*`. Il
    # faut un rôle IAM et une pod identity association — deux écritures AWS, en
    # attente de décision. Jusque-là la datasource est correctement DÉCLARÉE mais
    # répondra `403`/`no credentials`, et non `404` comme avec le placeholder :
    # la distinction compte pour diagnostiquer le 10/11.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: AMP
            type: prometheus
            access: proxy
            url: "https://aps-workspaces.eu-west-3.amazonaws.com/workspaces/ws-294f5b5c-de0f-497b-ab57-d13f3fb2736d"
            isDefault: true
            jsonData:
              httpMethod: POST
              sigV4Auth: true
              sigV4AuthType: default
              sigV4Region: eu-west-3
    serviceAccount:
      create: true
      name: grafana-paris
      # ⏳ cluster — une association Pod Identity sur CE ServiceAccount, avec la
      # MÊME politique en lecture que KEDA (DESIGN.md §4.3), scopée au seul
      # workspace :
      #   aws eks create-pod-identity-association --region eu-west-3 \
      #     --cluster-name paris-inference-demo \
      #     --namespace grafana-paris --service-account grafana-paris \
      #     --role-arn arn:aws:iam::382076407153:role/paris-demo-grafana-amp-reader
      # Sans elle, la source de données répond 403 et aucun panneau ne s'affiche.

    # 🎯 ÉPINGLAGE — `managed-by: peeks` ajouté le 2026-11-05, même raison que
    # pour `keda` (voir le bloc détaillé plus haut dans ce fichier). Ici l'enjeu
    # est le plus visible de la démo : Grafana est en `replicas: 1` avec
    # `deploymentStrategy: RollingUpdate`, donc une éviction fait DISPARAÎTRE le
    # tableau de bord de l'écran, devant 45 clients, à l'instant où l'on montre
    # la montée en charge. `node-type` seul le laisserait atterrir sur
    # `platform-general`, qui n'a aucune fenêtre de protection.
    # ⏳ Sans effet immédiat : l'Application `grafana-paris` ne rend toujours pas
    # son chart (bug amont sur `dashboards`, cf. AUDIT §5), donc aucun pod à
    # replacer aujourd'hui. L'épinglage sera actif dès qu'elle rendra.
    nodeSelector:
      node-type: general-purpose
      managed-by: peeks
      # Pas sur un nœud GPU : les trois pools d'inférence sont taintés, et
      # Grafana n'a rien à y faire.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 512Mi }

# ─────────────────────────────────────────────────────────────────────────────
# DCGM EXPORTER — ÉCRIT MAIS SUSPENDU
#
# ⚠️ NE PAS activer avant la vérification de DESIGN.md §1.2 : DCGM-Exporter est
# PRÉ-INSTALLÉ sur les nœuds GPU Auto Mode (Bottlerocket EKS Auto Nvidia) et
# intégré au Node Monitoring Agent. Reste à savoir s'il expose un /metrics
# scrapable — « intégré à NMA » n'implique pas « endpoint Prometheus ».
#
#   kubectl get ds -A | grep -i -E 'dcgm|nvidia'
#   kubectl get svc -A -o json | jq -r '.items[]|select(.spec.ports[]?.port==9400)|.metadata.name'
#
# Si un endpoint existe : SUPPRIMER ce bloc, laisser dcgm_exporter: false, et
# pointer la config de scrape AMP sur l'endpoint existant.
# Si aucun : garder ce bloc et passer dcgm_exporter: true.
#
# Transposé de l'Application ArgoCD d'ai-on-eks
# (infra/base/terraform/argocd-addons/nvidia-dcgm-exporter.yaml).
# ─────────────────────────────────────────────────────────────────────────────
dcgm-exporter:
  namespace: monitoring
  chartName: dcgm-exporter
  releaseName: dcgm-exporter
  chartRepository: https://nvidia.github.io/dcgm-exporter/helm-charts
  defaultVersion: "4.8.1"
  # POURQUOI 4.8.1 et pas 4.8.4 : c'est la version qu'ai-on-eks épingle
  # (infra/base/terraform/variables.tf l.518-522), donc déjà exercée sur du GPU AWS.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
  selector:
    matchExpressions:
      - key: enable_dcgm_exporter
        operator: In
        values: ["true"]
  valuesObject:
    # OBLIGATOIRE : nos trois pools GPU sont taintés, et la doc EKS est explicite —
    # « EKS Auto Mode manages its own device plugins and tolerates its NodePool
    # taints without configuration. For any component you install yourself, add
    # the toleration ». CE QUI CASSE sans : le DaemonSet ne se place sur aucun
    # nœud GPU, et le nœud paraît sain alors qu'il ne publie rien.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    # ═══════════════════════════════════════════════════════════════════════
    # 🩹 RESTRICTION AUX NŒUDS GPU — AJOUTÉE le 2026-11-05, APRÈS MESURE
    #
    # CE COMMENTAIRE REMPLACE UNE AFFIRMATION FAUSSE. Il disait :
    #   « PAS de nodeSelector : j'avais mis `inference-tier: floor`, c'était une
    #     erreur — ça aurait exclu le nœud de burst et le nœud shardé. Un
    #     DaemonSet avec la tolérance se place partout où il y a des GPU. »
    # La première moitié est juste : un `nodeSelector` ne fait que de l'égalité,
    # donc `inference-tier: floor` aurait bien exclu burst et sharded.
    # LA SECONDE EST FAUSSE, et la mesure l'a prouvé. Une toleration **autorise**
    # la planification sur un nœud taint é ; elle ne la **restreint pas**. Un
    # DaemonSet toléré se place PARTOUT, pas « partout où il y a des GPU ».
    #
    # CE QUE LA MESURE A DONNÉ, juste après l'activation du label :
    #   monitoring/dcgm-exporter   desired=3 current=3 ready=0
    #   3 pods en CrashLoopBackOff sur c5a.large, c7i-flex.large,
    #   c7i-flex.xlarge — tous nvidia.com/gpu=0
    #   logs : "Starting dcgm-exporter" puis exit status 1
    #
    # LA BONNE FORME est donc une `affinity`, pas un `nodeSelector` : elle
    # accepte `Exists`, ce qui couvre les trois tiers d'un coup là où l'égalité
    # d'un nodeSelector obligeait à en choisir un. Label relevé sur
    # `inference-floor-peeks` :
    #   {"inference-tier":"floor","managed-by":"peeks","node-type":"inference-floor"}
    #
    # POURQUOI PAS `managed-by: peeks` : `general-purpose-peeks` le porte aussi
    # et c'est un pool CPU — on reproduirait exactement le crash.
    # POURQUOI PAS un label de famille d'instance : le NodePool `gpu` intégré
    # d'Auto Mode ne pose aucun label propre, il n'existe donc pas de label GPU
    # universel sur ce cluster.
    #
    # CONSÉQUENCE ASSUMÉE : le DaemonSet ne couvre QUE les trois pools
    # d'inférence. Un GPU ajouté hors de ces pools ne serait pas scrapé — à
    # revoir si la flotte GPU s'élargit au-delà de la démo.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: inference-tier
                  operator: Exists
    # ═══════════════════════════════════════════════════════════════════════
    # ⚠️ DÉFAUT CORRIGÉ — J'AVAIS `securityContext.privileged: true` ET
    # `hostPID: true`. LES DEUX SONT SUPPRIMÉS, ET C'EST MIEUX À TOUS POINTS.
    #
    # Trouvé en téléchargeant le vrai chart (dcgm-exporter-4.8.1.tgz) et en
    # validant clé par clé. Trois faits :
    #
    # 1. CE N'ÉTAIT PAS UNE CLÉ IGNORÉE, C'ÉTAIT PIRE : un pod INVALIDE.
    #    Le défaut du chart est
    #      securityContext: {runAsNonRoot: false, runAsUser: 0,
    #                        capabilities: {add: [SYS_ADMIN], drop: [ALL]},
    #                        allowPrivilegeEscalation: FALSE}
    #    et le template fait `toYaml .Values.securityContext` — donc le merge
    #    Helm aurait laissé `privileged: true` ET `allowPrivilegeEscalation:
    #    false` dans le MÊME securityContext. Kubernetes REFUSE cette
    #    combinaison (« cannot set allowPrivilegeEscalation to false and
    #    privileged to true ») : le DaemonSet n'aurait jamais démarré un pod.
    #
    # 2. C'ÉTAIT INUTILE. Le chart n'a BESOIN ni de `privileged` ni d'un
    #    montage `/dev` : il ne monte que /var/lib/kubelet/pod-resources (plus
    #    TLS et web-config), et NVIDIA lui donne `SYS_ADMIN` + `runAsUser: 0`.
    #    C'est la posture que NVIDIA livre pour exactement ce travail.
    #
    # 3. MON MODÈLE ÉTAIT LE MAUVAIS. Je m'étais calqué sur la démonstration
    #    d'AWS (§DESIGN 1.1), qui lance un pod ÉCRIT À LA MAIN exécutant
    #    `dcgmi` — pas ce chart. Ce que cette démonstration prouve reste vrai
    #    (securityContext et hostPath FONCTIONNENT sur Auto Mode), mais elle ne
    #    dicte pas la configuration de ce chart.
    #
    # `hostPID` existe bien dans le chart (défaut `false`), mais NVIDIA ne le
    # demande pas : on garde le défaut. Moins de privilèges, et ça démarre.
    # => On ne surcharge NI securityContext NI hostPID. Le chart a raison.
    # ═══════════════════════════════════════════════════════════════════════
    serviceMonitor:
      enabled: false
      # POURQUOI false : PEEKS n'a PAS le Prometheus Operator, donc pas de CRD
      # ServiceMonitor. L'ingestion passe par le collecteur managé AMP.
    service:
      type: ClusterIP
      # Explicite, même si c'est le défaut du chart : un défaut d'exposition ne
      # se laisse pas implicite dans un fichier qu'on relit. Le collecteur AMP
      # scrape depuis l'intérieur du VPC, aucun accès externe n'est nécessaire.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { memory: 256Mi }


platform-manifests-bootstrap:
  valuesObject:

    # ═══════════════════════════════════════════════════════════════════════
    # 🔬 LEVIER A — UNE SEULE VARIABLE, POSÉE SEULE LE 2026-11-05.
    #
    # CE QUE ÇA FAIT : fait rendre au chart son pool de repli
    # `platform-general` (fallbackNodepools.pools), qui PORTE le label
    # `node-type: general-purpose`
    # (gitops/addons/charts/platform-manifests-bootstrap/values.yaml:96).
    # Le `nodeSelector` de `keda` et de `grafana-paris` devient alors
    # satisfiable, sans y toucher.
    #
    # CE QUE ÇA NE FAIT PAS, ET C'EST LE POINT : ce drapeau ne retire PAS le
    # pool intégré `general-purpose` du cluster. Le registre le dit lui-même —
    # il « mirror the cluster's own enableGeneralPurposeNodePool FROM ITS
    # SECRET ANNOTATION » : c'est un REFLET, pas un pilote. Un chart Helm ne
    # fait aucun appel EKS. Le pool intégré vient de
    # `computeConfig.nodePools`, piloté par la spec KRO EksCluster
    # (rg-eks.yaml:432) depuis `hub.enableGeneralPurposeNodePool` de
    # config.local.yaml — c'est un réglage de CRÉATION, et c'est le LEVIER B.
    #
    # ⛔ NE PAS TIRER LE LEVIER B À CHAUD. Mesuré le 2026-11-05 : les
    # NodeClaim portent un ownerReference vers leur NodePool avec
    # `blockOwnerDeletion: True`, donc supprimer le pool DRAINE ses nœuds.
    # Les deux nœuds `general-purpose` portent 37 pods, dont **les DEUX
    # répliques de aws-load-balancer-controller sur le MÊME nœud** (tout le
    # chemin d'ingress de la démo), `metrics-server`, `external-dns`,
    # `grafana-operator` et 13 composants Crossplane. ArgoCD et ESO et
    # Keycloak, eux, sont sur les nœuds `system`, que rg-eks.yaml:432
    # conserve toujours. Dégradation estimée : plusieurs minutes à un quart
    # d'heure — et NON BORNÉE si le pool de remplacement n'existe pas encore,
    # ce dont le chart avertit lui-même (« without an untainted pool every
    # add-on … is unschedulable »).
    #
    # POURQUOI SEUL : le paquet complet (branche `wip/paquet-complet`,
    # 4 commits) retire les `nodeSelector` ET pose `do-not-disrupt` — les deux
    # correctifs qui MASQUERAIENT l'effet de ce drapeau. Poussé ensemble,
    # personne ne saurait lequel a planifié KEDA. Donc : `nodeSelector`
    # INTACTS, annotation ABSENTE, et on lit le résultat.
    #
    # Chaîne, pas booléen : le gabarit fait `eq (toString .Values…) "false"`.
    enableGeneralPurposeNodePool: "false"

    # ═══════════════════════════════════════════════════════════════════════
    # ⚠️ LA NODECLASS N'EST PAS ICI — ET C'EST UNE CORRECTION
    #
    # J'avais d'abord posé la NodeClass dans une clé `customNodeClasses` de ce
    # chart. **Cette clé n'existe pas.** Le chart n'a que trois templates
    # (custom-nodepools.yaml, gpu-nodepool.yaml, trainium-nodepool.yaml) et
    # AUCUN point d'injection de NodeClass ; rien dans tout gitops/ ne rend une
    # ressource NodeClass, PEEKS s'appuyant sur la `default` d'Auto Mode.
    # Helm aurait silencieusement ignoré la clé, les NodePools auraient
    # référencé une NodeClass inexistante, aucun nœud GPU ne se serait lancé,
    # et les 494 $ seraient restés inconsommés SANS message d'erreur.
    #
    # La NodeClass vit donc dans ../../../manifests/gpu-nodeclass/nodeclass.yaml
    # de cette branche, servie par l'addon `gpu-nodeclass-peeks` défini EN HAUT
    # DE CE MÊME FICHIER (niveau cluster — c'était écrit `overlays/environments/
    # control-plane/overrides.yaml`, chemin de l'ancienne structure, corrigé).
    # ═══════════════════════════════════════════════════════════════════════

    # ═══════════════════════════════════════════════════════════════════════
    # LES TROIS NODEPOOLS — PATTERN n°3
    #
    # `customNodepools.pools` est le point d'extension de PREMIER RANG de PEEKS.
    # Son propre en-tête (custom-nodepools.yaml) : « the CONSUMER's list. ALWAYS
    # rendered, on every cluster, regardless of the gate ». Chaque entrée est
    # { name, spec: <karpenter.sh/v1 NodePool spec> }.
    #
    # Forme calquée sur les pools *-peeks existants
    # (workshop/overlay/configs/platform-manifests-bootstrap/values.yaml) :
    # clés de requirements du namespace Auto Mode, labels node-type +
    # managed-by, terminationGracePeriod long, et l'idiome de budget #892.
    #
    # Rendu VÉRIFIÉ : helm template du vrai chart PEEKS sort bien les trois
    # NodePools avec les bons weight/limits/disruption.
    # ═══════════════════════════════════════════════════════════════════════
    customNodepools:
      pools:

        # ─── LE POOL GÉNÉRALISTE — COPIE VERBATIM DU WORKSHOP ─────────────
        # Repris MOT POUR MOT de
        #   workshop/overlay/configs/platform-manifests-bootstrap/values.yaml
        # et NON réinventé : nous avons déjà payé une fois pour avoir improvisé
        # une convention (les `nodeSelector` posés sans le pool qui les porte).
        #
        # POURQUOI IL FAUT CE POOL ALORS QUE `platform-general` EXISTE DÉJÀ.
        # Le levier A a fait apparaître `platform-general`, le pool de repli
        # GÉNÉRIQUE du chart. Il porte bien `node-type: general-purpose` — c'est
        # lui qui a débloqué KEDA ce matin — mais son budget est
        # `[{nodes: "10%"}]` SANS `schedule`, et un budget non programmé est
        # toujours actif : il ne bloque JAMAIS rien. Il ne protège donc pas
        # Grafana d'une relocalisation en pleine démo.
        # Ce pool-ci porte `[{nodes: "0", schedule: "0 3 * * *", duration: 23h}]`
        # — la consolidation est bloquée 23 h sur 24, autorisée seulement entre
        # 02:00 et 03:00 UTC. C'est CE budget qui rend l'annotation
        # `karpenter.sh/do-not-disrupt` inutile.
        #
        # ET IL DOIT RESTER NON TAINTÉ. C'est la condition que le chart pose
        # lui-même : les ~28 pods d'addons amont qui migreront au levier B
        # n'ont AUCUN `nodeSelector`. Un pool labellé mais tainté satisferait
        # KEDA tout en laissant les autres inplanifiables — le pire des deux
        # mondes, et invisible jusqu'à ce que le pool intégré soit détruit.
        # `taints: null` ci-dessous, et c'est volontaire.
        #
        # `weight: 100` contre 10 pour `platform-general` : à l'égalité de
        # satisfaction, Karpenter préfère le poids le plus élevé, donc les pods
        # migreront ICI et non sur le repli génerique.
        #
        # PAS d'`expireAfter`, comme dans le workshop : le défaut du CRD est
        # `336h`, et 336h + 48h de terminationGracePeriod = 384h, sous le
        # plafond de 21 jours (504h). Vérifié en dry-run serveur :
        #   nodepool.karpenter.sh/general-purpose-peeks created (server dry run)
        - name: general-purpose-peeks
          spec:
            weight: 100
            disruption:
              consolidationPolicy: WhenEmptyOrUnderutilized
              consolidateAfter: 5m
              budgets:
                - nodes: "0"
                  schedule: "0 3 * * *"
                  duration: 23h
            template:
              metadata:
                labels:
                  node-type: general-purpose
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: default
                requirements:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: ["on-demand"]
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
                  - key: eks.amazonaws.com/instance-category
                    operator: In
                    values: ["c", "m", "r"]
                  - key: eks.amazonaws.com/instance-generation
                    operator: Gt
                    values: ["5"]
                  - key: eks.amazonaws.com/instance-size
                    operator: In
                    values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
                terminationGracePeriod: 48h

        # ⛔ PAS DE `system-peeks`, ET C'EST UN CHOIX DOCUMENTÉ.
        # Le workshop en déclare un, nous PAS, pour trois raisons mesurées :
        #   1. Le levier B ne retire QUE `general-purpose` du computeConfig.
        #      `rg-eks.yaml:432` garde toujours `["system"]`, et le commentaire
        #      amont dit pourquoi : « keeping at least one built-in is what
        #      makes EKS provision the "default" NodeClass + EC2 access entry
        #      that the custom *-peeks pools reference ». Retirer `system`
        #      casserait la NodeClass `default` que TOUS nos pools référencent.
        #   2. Le design amont REPOSE sur le built-in `system` tainté : « "system"
        #      is tainted CriticalAddonsOnly, so unpinned EventBus/CI pods still
        #      fall through to general-purpose-peeks ». Le mécanisme fonctionne
        #      déjà sans nous.
        #   3. `system-peeks` est tainté `CriticalAddonsOnly` ET en `weight: 100`.
        #      L'ajouter ferait préférer ce nouveau pool au built-in pour tout
        #      pod tolérant, donc provisionnerait un nœud et déplacerait à terme
        #      ESO, ArgoCD et Keycloak. Du brassage gratuit sur exactement les
        #      nœuds qu'on ne veut pas toucher.

        # ─── LE PLANCHER CHAUD ────────────────────────────────────────────
        # ⚠️ PAS de `spec.replicas` : la capacité statique dépend du feature gate
        # `staticCapacity`, et sur Auto Mode le contrôleur Karpenter est géré par
        # AWS — NON VÉRIFIABLE sans cluster. Le plancher tient autrement, et de
        # façon équivalente à l'écran :
        #   WhenEmpty + consolidateAfter Never -> jamais consolidé
        #   expireAfter Never                  -> jamais recyclé par expiry
        #   budget planifié nodes "0"          -> aucune disruption 23h/24
        #   limits.nodes 1                     -> jamais plus d'un nœud
        #   + KEDA minReplicaCount 1           -> le nœud n'est jamais vide
        - name: inference-floor-peeks
          spec:
            weight: 100
            limits:
              nodes: 1
              # POURQUOI ce garde-fou : sans lui, le weight 100 ferait
              # provisionner les répliques suivantes ICI, en on-demand
              # ordinaire, alors que l'ODCR ne couvre QU'UNE instance. C'est
              # `limits.nodes: 1` qui force le débordement vers le burst.
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: Never
              budgets:
                # IDIOME MAISON, issue #892 : un `nodes: "0"` NON planifié serait
                # toujours actif et MASQUERAIT toute fenêtre. On exprime donc
                # « coupé par défaut » par un `nodes: "0"` PLANIFIÉ couvrant
                # 23 h, en laissant volontairement le trou 02:00-03:00 UTC où le
                # défaut Karpenter (nodes: 10%) s'applique.
                # CE QUI CASSE si on met un budget non planifié : la fenêtre de
                # maintenance devient inatteignable, et un nœud drifté ne peut
                # plus jamais être remplacé.
                - nodes: "0"
                  schedule: "0 3 * * *"
                  duration: 23h
            template:
              metadata:
                labels:
                  node-type: inference-floor
                  inference-tier: floor
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks     # ⬅ la NodeClass ci-dessus
                requirements:
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["reserved", "on-demand"]
                    # `reserved` EN PREMIER : Karpenter épuise la capacité
                    # réservée avant de retomber sur l'on-demand ordinaire.
                    # JAMAIS de spot sur un plancher interactif.
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.2xlarge"]
                    # g6.2xlarge = 1x L4 (22 888 MiB), 8 vCPU, 32 GiB RAM.
                    # Mistral-7B : 14,5 Go BF16 -> ~6,7 GiB de KV cache à
                    # maxModelLen 16384. Confortable.
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                    # Redondant avec le sous-réseau unique de la NodeClass, mais
                    # explicite : l'ODCR est en 3b et n'est pas déplaçable.
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : `expireAfter: Never` était REJETÉ par le
                # CRD. Trois règles CEL de nodepools.karpenter.sh s'appliquent dès
                # que `nodeClassRef.group == 'eks.amazonaws.com'`, ce qui est notre
                # cas (NodeClass gpu-reserved-peeks) :
                #   R1  expireAfter + terminationGracePeriod <= 504h
                #   R2  expireAfter <= 480h   (si terminationGracePeriod absent)
                #   R3  expireAfter != 'Never'        <- CELLE QUI NOUS BLOQUAIT
                # Le pattern du schéma accepte `Never` (^(([0-9]+(s|m|h))+|Never)$),
                # mais R3 l'interdit pour ce groupe. Et le message d'erreur était
                # trompeur -- « type conversion error from 'string' to Duration » --
                # parce que `duration('Never')` échoue dans R1 AVANT que R3 ne
                # s'exprime. Ce n'est donc pas un bug de format, c'est une
                # interdiction explicite.
                #
                # POURQUOI 456h : c'est le maximum admis ici (456 + 48 = 504h, R1
                # est un `<=`), donc la plus longue vie possible pour ce pool. Il
                # restait 290h jusqu'au 18/11 au moment du correctif : 456h laisse
                # 166h de marge APRÈS la démo. Un nœud créé maintenant n'expire pas
                # avant le 24/11.
                expireAfter: 456h
                terminationGracePeriod: 48h    # = valeur maison des pools *-peeks

        # ─── LA TIER DE BURST — élastique, et PAS réservée ────────────────
        # C'est la moitié droite de la slide 15 : plancher sur capacité engagée,
        # burst sur capacité flexible. Réserver ce pool contredirait le propos
        # tenu à l'oral, et quelqu'un dans la salle le relèverait.
        - name: inference-burst-peeks
          spec:
            weight: 10
            limits:
              nodes: 3
            disruption:
              consolidationPolicy: WhenEmpty
              # WhenEmpty, PAS WhenEmptyOrUnderutilized : un serveur vLLM paraît
              # toujours « sous-utilisé » entre deux rafales, et le faire
              # remplacer relance un cold start complet. C'est le réglage
              # contre-intuitif de la session, et c'est l'inverse du NodePool gpu
              # livré par PEEKS.
              consolidateAfter: 10m            # aligné sur la fenêtre KEDA de 600 s
              budgets:
                - nodes: "1"
            template:
              metadata:
                labels:
                  node-type: inference-burst
                  inference-tier: burst
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks
                  # Le burst n'a pas besoin du sélecteur d'ODCR, mais il doit
                  # rester en 3b (g6 absent de 3a, et PEEKS n'a pas de 3c) :
                  # réutiliser la même NodeClass est le plus simple et le plus sûr.
                requirements:
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["on-demand", "spot"]
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.2xlarge"]
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : 720h + 1h = 721h dépassait les 504h de la
                # règle R1 du CRD (cf. le commentaire du pool floor ci-dessus).
                # 480h + 1h = 481h, sous la limite, et 480h reste la valeur ronde
                # que R2 admet seule. 20 jours, largement au-delà du 17/11.
                expireAfter: 480h
                terminationGracePeriod: 1h     # court : rien de précieux dessus

        # ─── LE BEAT SHARDING (optionnel) ─────────────────────────────────
        # Mistral-Small-24B en TP4 sur 4x L4. À n'activer que si le beat bonus
        # est conservé (demo-prep §13). limits.nodes: 1 = garde-fou de coût :
        # g6.12xlarge = 48 vCPU, 5,8412 $/h.
        - name: inference-sharded-peeks
          spec:
            weight: 5
            limits:
              nodes: 1
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: 5m
              budgets:
                - nodes: "1"
            template:
              metadata:
                labels:
                  node-type: inference-sharded
                  inference-tier: sharded
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks
                requirements:
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["on-demand"]
                    # Pas de spot : la démo ne doit pas se faire évincer en scène.
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.12xlarge"]
                    # 4x L4 = 91 552 MiB (89,4 GiB). Mistral-Small-24B : 48 Go
                    # BF16 en TP4 -> ~11,2 GiB/GPU, et ~35 GiB de KV cache.
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : même défaut que le pool de burst,
                # 720h + 1h = 721h > 504h. Même valeur de remplacement.
                expireAfter: 480h
                terminationGracePeriod: 1h

# ─────────────────────────────────────────────────────────────────────────────
# DEVLAKE — POINTE SUR LE GRAFANA DU CLUSTER
#
# LE DÉFAUT : `devlake-paris-inference-demo` restait sync=Unknown, jamais
# rendue. `helm template` échouait sur le sous-chart upstream :
#   validate.yaml:20 — Helm test requires grafana.enabled to be true or
#                      grafana.external.url to be provided
#
# POURQUOI LA CORRECTION EST ICI ET PAS DANS devlake/values.yaml.
# J'avais d'abord posé la valeur dans
# `overlays/clusters/paris-inference-demo/devlake/values.yaml`. Le fichier était
# BIEN LU — il figurait dans la ligne `helm template --values …` — et pourtant
# rien ne changeait. La raison : `gitops/addons/registry/platform.yaml:530-534`
# pose la clé dans le `valuesObject` de l'addon, et un `valuesObject` a la
# priorité sur TOUS les valueFiles. Ma valeur était écrasée par une chaîne vide.
# J'ai donc supprimé ce fichier plutôt que de le laisser : un fichier qui ne
# produit aucun effet est un piège pour la prochaine lecture.
#
# CE QUE LE REGISTRY RENDAIT, et pourquoi c'était vide :
#   url: '{{if …"aws_grafana_url"}}…{{else if eq (…"enable_grafana"|default "false") "true"}}
#          {{printf "%s/grafana" …ingress_domain_name}}{{end}}'
# Deux branches, aucune ne s'active chez nous :
#   - `aws_grafana_url` : annotation ABSENTE du secret de cluster, parce
#     qu'Amazon Managed Grafana n'existe pas en eu-west-3 et n'a donc jamais
#     été provisionné ;
#   - label `enable_grafana` : absent lui aussi. Le secret porte
#     `enable_grafana_dashboards`, `enable_grafana_operator` et
#     `enable_grafana_paris`, mais pas `enable_grafana`.
# Le registry avait donc bien prévu le cas « Grafana dans le cluster », mais
# pour l'addon standard `grafana`. Le nôtre est `grafana-paris`, un addon que
# cet overlay apporte, et aucune des deux branches ne le connaît.
#
# L'URL est celle du Service rendu par le chart, pas une supposition : le test
# `helm template` local du même commit a rendu
#   Service grafana-paris   ports=[80]
# dans le namespace `grafana-paris`, d'où l'adresse ci-dessous.
#
# C'est une URL de LIENS — DevLake s'en sert pour renvoyer vers ses tableaux de
# bord — et non une dépendance de démarrage.
# ─────────────────────────────────────────────────────────────────────────────
devlake:
  valuesObject:
    devlake:
      grafana:
        enabled: false
        external:
          url: http://grafana-paris.grafana-paris.svc.cluster.local

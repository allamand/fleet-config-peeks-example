# ─────────────────────────────────────────────────────────────────────────────
# DCGM EXPORTER — ÉCRIT MAIS SUSPENDU
#
# ⚠️ NE PAS activer avant la vérification de DESIGN.md §1.2 : DCGM-Exporter est
# PRÉ-INSTALLÉ sur les nœuds GPU Auto Mode (Bottlerocket EKS Auto Nvidia) et
# intégré au Node Monitoring Agent. Reste à savoir s'il expose un /metrics
# scrapable — « intégré à NMA » n'implique pas « endpoint Prometheus ».
#
#   kubectl get ds -A | grep -i -E 'dcgm|nvidia'
#   kubectl get svc -A -o json | jq -r '.items[]|select(.spec.ports[]?.port==9400)|.metadata.name'
#
# Si un endpoint existe : SUPPRIMER ce bloc, laisser dcgm_exporter: false, et
# pointer la config de scrape AMP sur l'endpoint existant.
# Si aucun : garder ce bloc et passer dcgm_exporter: true.
#
# Transposé de l'Application ArgoCD d'ai-on-eks
# (infra/base/terraform/argocd-addons/nvidia-dcgm-exporter.yaml).
# ─────────────────────────────────────────────────────────────────────────────
dcgm-exporter:
  namespace: monitoring
  chartName: dcgm-exporter
  releaseName: dcgm-exporter
  chartRepository: https://nvidia.github.io/dcgm-exporter/helm-charts
  defaultVersion: "4.8.1"
  # POURQUOI 4.8.1 et pas 4.8.4 : c'est la version qu'ai-on-eks épingle
  # (infra/base/terraform/variables.tf l.518-522), donc déjà exercée sur du GPU AWS.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
  selector:
    matchExpressions:
      - key: enable_dcgm_exporter
        operator: In
        values: ["true"]
  valuesObject:
    # OBLIGATOIRE : nos trois pools GPU sont taintés, et la doc EKS est explicite —
    # « EKS Auto Mode manages its own device plugins and tolerates its NodePool
    # taints without configuration. For any component you install yourself, add
    # the toleration ». CE QUI CASSE sans : le DaemonSet ne se place sur aucun
    # nœud GPU, et le nœud paraît sain alors qu'il ne publie rien.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    # ═══════════════════════════════════════════════════════════════════════
    # 🩹 RESTRICTION AUX NŒUDS GPU — AJOUTÉE le 2026-11-05, APRÈS MESURE
    #
    # CE COMMENTAIRE REMPLACE UNE AFFIRMATION FAUSSE. Il disait :
    #   « PAS de nodeSelector : j'avais mis `inference-tier: floor`, c'était une
    #     erreur — ça aurait exclu le nœud de burst et le nœud shardé. Un
    #     DaemonSet avec la tolérance se place partout où il y a des GPU. »
    # La première moitié est juste : un `nodeSelector` ne fait que de l'égalité,
    # donc `inference-tier: floor` aurait bien exclu burst et sharded.
    # LA SECONDE EST FAUSSE, et la mesure l'a prouvé. Une toleration **autorise**
    # la planification sur un nœud taint é ; elle ne la **restreint pas**. Un
    # DaemonSet toléré se place PARTOUT, pas « partout où il y a des GPU ».
    #
    # CE QUE LA MESURE A DONNÉ, juste après l'activation du label :
    #   monitoring/dcgm-exporter   desired=3 current=3 ready=0
    #   3 pods en CrashLoopBackOff sur c5a.large, c7i-flex.large,
    #   c7i-flex.xlarge — tous nvidia.com/gpu=0
    #   logs : "Starting dcgm-exporter" puis exit status 1
    #
    # LA BONNE FORME est donc une `affinity`, pas un `nodeSelector` : elle
    # accepte `Exists`, ce qui couvre les trois tiers d'un coup là où l'égalité
    # d'un nodeSelector obligeait à en choisir un. Label relevé sur
    # `inference-floor-peeks` :
    #   {"inference-tier":"floor","managed-by":"peeks","node-type":"inference-floor"}
    #
    # POURQUOI PAS `managed-by: peeks` : `general-purpose-peeks` le porte aussi
    # et c'est un pool CPU — on reproduirait exactement le crash.
    # POURQUOI PAS un label de famille d'instance : le NodePool `gpu` intégré
    # d'Auto Mode ne pose aucun label propre, il n'existe donc pas de label GPU
    # universel sur ce cluster.
    #
    # CONSÉQUENCE ASSUMÉE : le DaemonSet ne couvre QUE les trois pools
    # d'inférence. Un GPU ajouté hors de ces pools ne serait pas scrapé — à
    # revoir si la flotte GPU s'élargit au-delà de la démo.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: inference-tier
                  operator: Exists
    # ═══════════════════════════════════════════════════════════════════════
    # ⚠️ DÉFAUT CORRIGÉ — J'AVAIS `securityContext.privileged: true` ET
    # `hostPID: true`. LES DEUX SONT SUPPRIMÉS, ET C'EST MIEUX À TOUS POINTS.
    #
    # Trouvé en téléchargeant le vrai chart (dcgm-exporter-4.8.1.tgz) et en
    # validant clé par clé. Trois faits :
    #
    # 1. CE N'ÉTAIT PAS UNE CLÉ IGNORÉE, C'ÉTAIT PIRE : un pod INVALIDE.
    #    Le défaut du chart est
    #      securityContext: {runAsNonRoot: false, runAsUser: 0,
    #                        capabilities: {add: [SYS_ADMIN], drop: [ALL]},
    #                        allowPrivilegeEscalation: FALSE}
    #    et le template fait `toYaml .Values.securityContext` — donc le merge
    #    Helm aurait laissé `privileged: true` ET `allowPrivilegeEscalation:
    #    false` dans le MÊME securityContext. Kubernetes REFUSE cette
    #    combinaison (« cannot set allowPrivilegeEscalation to false and
    #    privileged to true ») : le DaemonSet n'aurait jamais démarré un pod.
    #
    # 2. C'ÉTAIT INUTILE. Le chart n'a BESOIN ni de `privileged` ni d'un
    #    montage `/dev` : il ne monte que /var/lib/kubelet/pod-resources (plus
    #    TLS et web-config), et NVIDIA lui donne `SYS_ADMIN` + `runAsUser: 0`.
    #    C'est la posture que NVIDIA livre pour exactement ce travail.
    #
    # 3. MON MODÈLE ÉTAIT LE MAUVAIS. Je m'étais calqué sur la démonstration
    #    d'AWS (§DESIGN 1.1), qui lance un pod ÉCRIT À LA MAIN exécutant
    #    `dcgmi` — pas ce chart. Ce que cette démonstration prouve reste vrai
    #    (securityContext et hostPath FONCTIONNENT sur Auto Mode), mais elle ne
    #    dicte pas la configuration de ce chart.
    #
    # `hostPID` existe bien dans le chart (défaut `false`), mais NVIDIA ne le
    # demande pas : on garde le défaut. Moins de privilèges, et ça démarre.
    # => On ne surcharge NI securityContext NI hostPID. Le chart a raison.
    # ═══════════════════════════════════════════════════════════════════════
    serviceMonitor:
      enabled: false
      # POURQUOI false : PEEKS n'a PAS le Prometheus Operator, donc pas de CRD
      # ServiceMonitor. L'ingestion passe par le collecteur managé AMP.
    service:
      type: ClusterIP
      # Explicite, même si c'est le défaut du chart : un défaut d'exposition ne
      # se laisse pas implicite dans un fichier qu'on relit. Le collecteur AMP
      # scrape depuis l'intérieur du VPC, aucun accès externe n'est nécessaire.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { memory: 256Mi }


platform-manifests-bootstrap:
  valuesObject:

    # ═══════════════════════════════════════════════════════════════════════
    # 🔬 LEVIER A — UNE SEULE VARIABLE, POSÉE SEULE LE 2026-11-05.
    #
    # CE QUE ÇA FAIT : fait rendre au chart son pool de repli
    # `platform-general` (fallbackNodepools.pools), qui PORTE le label
    # `node-type: general-purpose`
    # (gitops/addons/charts/platform-manifests-bootstrap/values.yaml:96).
    # Le `nodeSelector` de `keda` et de `grafana-paris` devient alors
    # satisfiable, sans y toucher.
    #
    # CE QUE ÇA NE FAIT PAS, ET C'EST LE POINT : ce drapeau ne retire PAS le
    # pool intégré `general-purpose` du cluster. Le registre le dit lui-même —
    # il « mirror the cluster's own enableGeneralPurposeNodePool FROM ITS
    # SECRET ANNOTATION » : c'est un REFLET, pas un pilote. Un chart Helm ne
    # fait aucun appel EKS. Le pool intégré vient de
    # `computeConfig.nodePools`, piloté par la spec KRO EksCluster
    # (rg-eks.yaml:432) depuis `hub.enableGeneralPurposeNodePool` de
    # config.local.yaml — c'est un réglage de CRÉATION, et c'est le LEVIER B.
    #
    # ⛔ NE PAS TIRER LE LEVIER B À CHAUD. Mesuré le 2026-11-05 : les
    # NodeClaim portent un ownerReference vers leur NodePool avec
    # `blockOwnerDeletion: True`, donc supprimer le pool DRAINE ses nœuds.
    # Les deux nœuds `general-purpose` portent 37 pods, dont **les DEUX
    # répliques de aws-load-balancer-controller sur le MÊME nœud** (tout le
    # chemin d'ingress de la démo), `metrics-server`, `external-dns`,
    # `grafana-operator` et 13 composants Crossplane. ArgoCD et ESO et
    # Keycloak, eux, sont sur les nœuds `system`, que rg-eks.yaml:432
    # conserve toujours. Dégradation estimée : plusieurs minutes à un quart
    # d'heure — et NON BORNÉE si le pool de remplacement n'existe pas encore,
    # ce dont le chart avertit lui-même (« without an untainted pool every
    # add-on … is unschedulable »).
    #
    # POURQUOI SEUL : le paquet complet (branche `wip/paquet-complet`,
    # 4 commits) retire les `nodeSelector` ET pose `do-not-disrupt` — les deux
    # correctifs qui MASQUERAIENT l'effet de ce drapeau. Poussé ensemble,
    # personne ne saurait lequel a planifié KEDA. Donc : `nodeSelector`
    # INTACTS, annotation ABSENTE, et on lit le résultat.
    #
    # Chaîne, pas booléen : le gabarit fait `eq (toString .Values…) "false"`.
    enableGeneralPurposeNodePool: "false"

    # ═══════════════════════════════════════════════════════════════════════
    # ⚠️ LA NODECLASS N'EST PAS ICI — ET C'EST UNE CORRECTION
    #
    # J'avais d'abord posé la NodeClass dans une clé `customNodeClasses` de ce
    # chart. **Cette clé n'existe pas.** Le chart n'a que trois templates
    # (custom-nodepools.yaml, gpu-nodepool.yaml, trainium-nodepool.yaml) et
    # AUCUN point d'injection de NodeClass ; rien dans tout gitops/ ne rend une
    # ressource NodeClass, PEEKS s'appuyant sur la `default` d'Auto Mode.
    # Helm aurait silencieusement ignoré la clé, les NodePools auraient
    # référencé une NodeClass inexistante, aucun nœud GPU ne se serait lancé,
    # et les 494 $ seraient restés inconsommés SANS message d'erreur.
    #
    # La NodeClass vit donc dans ../../../manifests/gpu-nodeclass/nodeclass.yaml
    # de cette branche, servie par l'addon `gpu-nodeclass-peeks` défini EN HAUT
    # DE CE MÊME FICHIER (niveau cluster — c'était écrit `overlays/environments/
    # control-plane/overrides.yaml`, chemin de l'ancienne structure, corrigé).
    # ═══════════════════════════════════════════════════════════════════════

    # ═══════════════════════════════════════════════════════════════════════
    # LES TROIS NODEPOOLS — PATTERN n°3
    #
    # `customNodepools.pools` est le point d'extension de PREMIER RANG de PEEKS.
    # Son propre en-tête (custom-nodepools.yaml) : « the CONSUMER's list. ALWAYS
    # rendered, on every cluster, regardless of the gate ». Chaque entrée est
    # { name, spec: <karpenter.sh/v1 NodePool spec> }.
    #
    # Forme calquée sur les pools *-peeks existants
    # (workshop/overlay/configs/platform-manifests-bootstrap/values.yaml) :
    # clés de requirements du namespace Auto Mode, labels node-type +
    # managed-by, terminationGracePeriod long, et l'idiome de budget #892.
    #
    # Rendu VÉRIFIÉ : helm template du vrai chart PEEKS sort bien les trois
    # NodePools avec les bons weight/limits/disruption.
    # ═══════════════════════════════════════════════════════════════════════
    customNodepools:
      pools:

        # ─── LE POOL GÉNÉRALISTE — COPIE VERBATIM DU WORKSHOP ─────────────
        # Repris MOT POUR MOT de
        #   workshop/overlay/configs/platform-manifests-bootstrap/values.yaml
        # et NON réinventé : nous avons déjà payé une fois pour avoir improvisé
        # une convention (les `nodeSelector` posés sans le pool qui les porte).
        #
        # POURQUOI IL FAUT CE POOL ALORS QUE `platform-general` EXISTE DÉJÀ.
        # Le levier A a fait apparaître `platform-general`, le pool de repli
        # GÉNÉRIQUE du chart. Il porte bien `node-type: general-purpose` — c'est
        # lui qui a débloqué KEDA ce matin — mais son budget est
        # `[{nodes: "10%"}]` SANS `schedule`, et un budget non programmé est
        # toujours actif : il ne bloque JAMAIS rien. Il ne protège donc pas
        # Grafana d'une relocalisation en pleine démo.
        # Ce pool-ci porte `[{nodes: "0", schedule: "0 3 * * *", duration: 23h}]`
        # — la consolidation est bloquée 23 h sur 24, autorisée seulement entre
        # 02:00 et 03:00 UTC. C'est CE budget qui rend l'annotation
        # `karpenter.sh/do-not-disrupt` inutile.
        #
        # ET IL DOIT RESTER NON TAINTÉ. C'est la condition que le chart pose
        # lui-même : les ~28 pods d'addons amont qui migreront au levier B
        # n'ont AUCUN `nodeSelector`. Un pool labellé mais tainté satisferait
        # KEDA tout en laissant les autres inplanifiables — le pire des deux
        # mondes, et invisible jusqu'à ce que le pool intégré soit détruit.
        # `taints: null` ci-dessous, et c'est volontaire.
        #
        # `weight: 100` contre 10 pour `platform-general` : à l'égalité de
        # satisfaction, Karpenter préfère le poids le plus élevé, donc les pods
        # migreront ICI et non sur le repli génerique.
        #
        # PAS d'`expireAfter`, comme dans le workshop : le défaut du CRD est
        # `336h`, et 336h + 48h de terminationGracePeriod = 384h, sous le
        # plafond de 21 jours (504h). Vérifié en dry-run serveur :
        #   nodepool.karpenter.sh/general-purpose-peeks created (server dry run)
        - name: general-purpose-peeks
          spec:
            weight: 100
            disruption:
              consolidationPolicy: WhenEmptyOrUnderutilized
              consolidateAfter: 5m
              budgets:
                - nodes: "0"
                  schedule: "0 3 * * *"
                  duration: 23h
            template:
              metadata:
                labels:
                  node-type: general-purpose
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: default
                requirements:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: ["on-demand"]
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
                  - key: eks.amazonaws.com/instance-category
                    operator: In
                    values: ["c", "m", "r"]
                  - key: eks.amazonaws.com/instance-generation
                    operator: Gt
                    values: ["5"]
                  - key: eks.amazonaws.com/instance-size
                    operator: In
                    values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
                terminationGracePeriod: 48h

        # ⛔ PAS DE `system-peeks`, ET C'EST UN CHOIX DOCUMENTÉ.
        # Le workshop en déclare un, nous PAS, pour trois raisons mesurées :
        #   1. Le levier B ne retire QUE `general-purpose` du computeConfig.
        #      `rg-eks.yaml:432` garde toujours `["system"]`, et le commentaire
        #      amont dit pourquoi : « keeping at least one built-in is what
        #      makes EKS provision the "default" NodeClass + EC2 access entry
        #      that the custom *-peeks pools reference ». Retirer `system`
        #      casserait la NodeClass `default` que TOUS nos pools référencent.
        #   2. Le design amont REPOSE sur le built-in `system` tainté : « "system"
        #      is tainted CriticalAddonsOnly, so unpinned EventBus/CI pods still
        #      fall through to general-purpose-peeks ». Le mécanisme fonctionne
        #      déjà sans nous.
        #   3. `system-peeks` est tainté `CriticalAddonsOnly` ET en `weight: 100`.
        #      L'ajouter ferait préférer ce nouveau pool au built-in pour tout
        #      pod tolérant, donc provisionnerait un nœud et déplacerait à terme
        #      ESO, ArgoCD et Keycloak. Du brassage gratuit sur exactement les
        #      nœuds qu'on ne veut pas toucher.

        # ─── LE PLANCHER CHAUD ────────────────────────────────────────────
        # ⚠️ PAS de `spec.replicas` : la capacité statique dépend du feature gate
        # `staticCapacity`, et sur Auto Mode le contrôleur Karpenter est géré par
        # AWS — NON VÉRIFIABLE sans cluster. Le plancher tient autrement, et de
        # façon équivalente à l'écran :
        #   WhenEmpty + consolidateAfter Never -> jamais consolidé
        #   expireAfter Never                  -> jamais recyclé par expiry
        #   budget planifié nodes "0"          -> aucune disruption 23h/24
        #   limits.nodes 1                     -> jamais plus d'un nœud
        #   + KEDA minReplicaCount 1           -> le nœud n'est jamais vide
        - name: inference-floor-peeks
          spec:
            weight: 100
            limits:
              nodes: 1
              # POURQUOI ce garde-fou : sans lui, le weight 100 ferait
              # provisionner les répliques suivantes ICI, en on-demand
              # ordinaire, alors que l'ODCR ne couvre QU'UNE instance. C'est
              # `limits.nodes: 1` qui force le débordement vers le burst.
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: Never
              budgets:
                # IDIOME MAISON, issue #892 : un `nodes: "0"` NON planifié serait
                # toujours actif et MASQUERAIT toute fenêtre. On exprime donc
                # « coupé par défaut » par un `nodes: "0"` PLANIFIÉ couvrant
                # 23 h, en laissant volontairement le trou 02:00-03:00 UTC où le
                # défaut Karpenter (nodes: 10%) s'applique.
                # CE QUI CASSE si on met un budget non planifié : la fenêtre de
                # maintenance devient inatteignable, et un nœud drifté ne peut
                # plus jamais être remplacé.
                - nodes: "0"
                  schedule: "0 3 * * *"
                  duration: 23h
            template:
              metadata:
                labels:
                  node-type: inference-floor
                  inference-tier: floor
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks     # ⬅ la NodeClass ci-dessus
                requirements:
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["reserved", "on-demand"]
                    # `reserved` EN PREMIER : Karpenter épuise la capacité
                    # réservée avant de retomber sur l'on-demand ordinaire.
                    # JAMAIS de spot sur un plancher interactif.
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.2xlarge"]
                    # g6.2xlarge = 1x L4 (22 888 MiB), 8 vCPU, 32 GiB RAM.
                    # Mistral-7B : 14,5 Go BF16 -> ~6,7 GiB de KV cache à
                    # maxModelLen 16384. Confortable.
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                    # Redondant avec le sous-réseau unique de la NodeClass, mais
                    # explicite : l'ODCR est en 3b et n'est pas déplaçable.
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : `expireAfter: Never` était REJETÉ par le
                # CRD. Trois règles CEL de nodepools.karpenter.sh s'appliquent dès
                # que `nodeClassRef.group == 'eks.amazonaws.com'`, ce qui est notre
                # cas (NodeClass gpu-reserved-peeks) :
                #   R1  expireAfter + terminationGracePeriod <= 504h
                #   R2  expireAfter <= 480h   (si terminationGracePeriod absent)
                #   R3  expireAfter != 'Never'        <- CELLE QUI NOUS BLOQUAIT
                # Le pattern du schéma accepte `Never` (^(([0-9]+(s|m|h))+|Never)$),
                # mais R3 l'interdit pour ce groupe. Et le message d'erreur était
                # trompeur -- « type conversion error from 'string' to Duration » --
                # parce que `duration('Never')` échoue dans R1 AVANT que R3 ne
                # s'exprime. Ce n'est donc pas un bug de format, c'est une
                # interdiction explicite.
                #
                # POURQUOI 456h : c'est le maximum admis ici (456 + 48 = 504h, R1
                # est un `<=`), donc la plus longue vie possible pour ce pool. Il
                # restait 290h jusqu'au 18/11 au moment du correctif : 456h laisse
                # 166h de marge APRÈS la démo. Un nœud créé maintenant n'expire pas
                # avant le 24/11.
                expireAfter: 456h
                terminationGracePeriod: 48h    # = valeur maison des pools *-peeks

        # ─── LA TIER DE BURST — élastique, et PAS réservée ────────────────
        # C'est la moitié droite de la slide 15 : plancher sur capacité engagée,
        # burst sur capacité flexible. Réserver ce pool contredirait le propos
        # tenu à l'oral, et quelqu'un dans la salle le relèverait.
        - name: inference-burst-peeks
          spec:
            weight: 10
            limits:
              nodes: 3
            disruption:
              consolidationPolicy: WhenEmpty
              # WhenEmpty, PAS WhenEmptyOrUnderutilized : un serveur vLLM paraît
              # toujours « sous-utilisé » entre deux rafales, et le faire
              # remplacer relance un cold start complet. C'est le réglage
              # contre-intuitif de la session, et c'est l'inverse du NodePool gpu
              # livré par PEEKS.
              consolidateAfter: 10m            # aligné sur la fenêtre KEDA de 600 s
              budgets:
                - nodes: "1"
            template:
              metadata:
                labels:
                  node-type: inference-burst
                  inference-tier: burst
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks
                  # Le burst n'a pas besoin du sélecteur d'ODCR, mais il doit
                  # rester en 3b (g6 absent de 3a, et PEEKS n'a pas de 3c) :
                  # réutiliser la même NodeClass est le plus simple et le plus sûr.
                requirements:
                  # ═════════════════════════════════════════════════════════
                  # DÉBORDEMENT : SPOT, AVEC REPLI ON-DEMAND.
                  # Décidé le 2026-11-07. Remplace la décision « spot seul »
                  # du 2026-11-06, et rétablit la valeur de `e356570`. Ne
                  # concerne QUE ce pool ; celui de la réservation reste en
                  # ["reserved", "on-demand"].
                  #
                  # ⚠️ CE RETOUR EN ARRIÈRE N'EST PAS UN REVIREMENT : il est
                  # fondé sur une MESURE, prise entre-temps, qui a transformé
                  # une probabilité en fait.
                  #
                  # CE QUE LE TEST « SPOT SEUL » A MONTRÉ, le 2026-11-06 à
                  # partir de 18:42:12Z :
                  #   · KEDA a lu la file et demandé 4 répliques en 62 s —
                  #     la chaîne de mise à l'échelle des POD fonctionne ;
                  #   · Karpenter a nommé jusqu'à 3 NodeClaims de
                  #     débordement, et AUCUN n'est devenu un nœud ;
                  #   · EC2 a refusé 17 fois, de 18:42:36Z à 19:03:57Z :
                  #       UnfulfillableCapacity: Unable to fulfill capacity
                  #       due to your request configuration.
                  #       (aws-operation-name=CreateFleet)
                  #   · 3 pods sont restés Pending jusqu'à la coupure de la
                  #     charge, et la démonstration n'aurait rien montré.
                  #
                  # Le score de placement spot l'annonçait : 1 sur une échelle
                  # de 1 à 10, pour g6.2xlarge en eu-west-3, aux cibles 1, 2
                  # et 3, dans les deux zones qui l'offrent. Témoins de
                  # comparaison, même région et même cible : m5.large → 3,
                  # c5.xlarge → 3 — l'instrument discrimine, et g6.2xlarge
                  # sort en dessous de types abondants. Score confirmé sur
                  # TROIS relevés : 15:27Z, 18:41Z, et une reprise avant le
                  # test.
                  #
                  # Un marché spot EXISTE pourtant — cotations publiées en
                  # eu-west-3b à 0,4224 USD/h (08:00Z) puis 0,4202 (15:00Z),
                  # et le type est offert en 3b et 3c. Mais un prix publié
                  # n'est pas une capacité disponible, et c'est exactement ce
                  # que le test a établi.
                  #
                  # CE QUE LE REPLI CHANGE : Karpenter retient toujours
                  # l'offre la moins chère compatible, donc il essaiera le
                  # spot d'abord et retombera sur l'on-demand quand le spot
                  # est refusé. L'ordre de cette liste n'y est pour rien —
                  # `In` est un opérateur d'ENSEMBLE, sans préférence. Ce
                  # bloc est donc identique en comportement à
                  # ["on-demand", "spot"].
                  #
                  # À RELEVER PENDANT LE TEST, et non à supposer : le
                  # capacity-type RÉEL de chaque nœud obtenu. C'est la seule
                  # façon de savoir si le spot a fini par se matérialiser ou
                  # si tout est venu de l'on-demand.
                  # ═════════════════════════════════════════════════════════
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["spot", "on-demand"]
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.2xlarge"]
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : 720h + 1h = 721h dépassait les 504h de la
                # règle R1 du CRD (cf. le commentaire du pool floor ci-dessus).
                # 480h + 1h = 481h, sous la limite, et 480h reste la valeur ronde
                # que R2 admet seule. 20 jours, largement au-delà du 17/11.
                expireAfter: 480h
                terminationGracePeriod: 1h     # court : rien de précieux dessus

        # ─── LE BEAT SHARDING (optionnel) ─────────────────────────────────
        # Mistral-Small-24B en TP4 sur 4x L4. À n'activer que si le beat bonus
        # est conservé (demo-prep §13). limits.nodes: 1 = garde-fou de coût :
        # g6.12xlarge = 48 vCPU, 5,8412 $/h.
        - name: inference-sharded-peeks
          spec:
            weight: 5
            limits:
              nodes: 1
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: 5m
              budgets:
                - nodes: "1"
            template:
              metadata:
                labels:
                  node-type: inference-sharded
                  inference-tier: sharded
                  managed-by: peeks
              spec:
                nodeClassRef:
                  group: eks.amazonaws.com
                  kind: NodeClass
                  name: gpu-reserved-peeks
                requirements:
                  - key: "karpenter.sh/capacity-type"
                    operator: In
                    values: ["on-demand"]
                    # Pas de spot : la démo ne doit pas se faire évincer en scène.
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
                  - key: "node.kubernetes.io/instance-type"
                    operator: In
                    values: ["g6.12xlarge"]
                    # 4x L4 = 91 552 MiB (89,4 GiB). Mistral-Small-24B : 48 Go
                    # BF16 en TP4 -> ~11,2 GiB/GPU, et ~35 GiB de KV cache.
                  - key: "topology.kubernetes.io/zone"
                    operator: In
                    values: ["eu-west-3b"]
                taints:
                  - key: nvidia.com/gpu
                    effect: NoSchedule
                # CORRIGÉ le 2026-11-05 : même défaut que le pool de burst,
                # 720h + 1h = 721h > 504h. Même valeur de remplacement.
                expireAfter: 480h
                terminationGracePeriod: 1h

# ─────────────────────────────────────────────────────────────────────────────
# DEVLAKE — POINTE SUR LE GRAFANA DU CLUSTER
#
# LE DÉFAUT : `devlake-paris-inference-demo` restait sync=Unknown, jamais
# rendue. `helm template` échouait sur le sous-chart upstream :
#   validate.yaml:20 — Helm test requires grafana.enabled to be true or
#                      grafana.external.url to be provided
#
# POURQUOI LA CORRECTION EST ICI ET PAS DANS devlake/values.yaml.
# J'avais d'abord posé la valeur dans
# `overlays/clusters/paris-inference-demo/devlake/values.yaml`. Le fichier était
# BIEN LU — il figurait dans la ligne `helm template --values …` — et pourtant
# rien ne changeait. La raison : `gitops/addons/registry/platform.yaml:530-534`
# pose la clé dans le `valuesObject` de l'addon, et un `valuesObject` a la
# priorité sur TOUS les valueFiles. Ma valeur était écrasée par une chaîne vide.
# J'ai donc supprimé ce fichier plutôt que de le laisser : un fichier qui ne
# produit aucun effet est un piège pour la prochaine lecture.
#
# CE QUE LE REGISTRY RENDAIT, et pourquoi c'était vide :
#   url: '{{if …"aws_grafana_url"}}…{{else if eq (…"enable_grafana"|default "false") "true"}}
#          {{printf "%s/grafana" …ingress_domain_name}}{{end}}'
# Deux branches, aucune ne s'active chez nous :
#   - `aws_grafana_url` : annotation ABSENTE du secret de cluster, parce
#     qu'Amazon Managed Grafana n'existe pas en eu-west-3 et n'a donc jamais
#     été provisionné ;
#   - label `enable_grafana` : absent lui aussi. Le secret porte
#     `enable_grafana_dashboards`, `enable_grafana_operator` et
#     `enable_grafana_paris`, mais pas `enable_grafana`.
# Le registry avait donc bien prévu le cas « Grafana dans le cluster », mais
# pour l'addon standard `grafana`. Le nôtre est `grafana-paris`, un addon que
# cet overlay apporte, et aucune des deux branches ne le connaît.
#
# L'URL est celle du Service rendu par le chart, pas une supposition : le test
# `helm template` local du même commit a rendu
#   Service grafana-paris   ports=[80]
# dans le namespace `grafana-paris`, d'où l'adresse ci-dessous.
#
# C'est une URL de LIENS — DevLake s'en sert pour renvoyer vers ses tableaux de
# bord — et non une dépendance de démarrage.
# ─────────────────────────────────────────────────────────────────────────────
devlake:
  valuesObject:
    devlake:
      grafana:
        enabled: false
        external:
          url: http://grafana-paris.grafana-paris.svc.cluster.local

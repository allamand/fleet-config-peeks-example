# ═════════════════════════════════════════════════════════════════════════════
#  CHEMIN DANS LA BRANCHE : overlays/clusters/paris-inference-demo/overrides.yaml
#
#  Lu par l'appset `cluster-addons` au slot $overlay, EN DERNIER de ses
#  valueFiles (gitops/bootstrap/addons.yaml l.64), donc il gagne sur tout.
#
#  POURQUOI AU NIVEAU **CLUSTER** — CORRECTION DE CETTE PASSE :
#  ce repo sert DÉJÀ peeks-a-hub et peeks-b-hub. Sébastien l'écrit lui-même dans
#  overlays/clusters/peeks-a-hub/overrides.yaml : « Do NOT move this entry to
#  overlays/environments/control-plane/overrides.yaml: both hubs read that file ».
#  Mes entrées posées au niveau environment auraient atterri sur les deux hubs.
#
#  PRÉCÉDENT QUI VALIDE TOUT CE FICHIER : commit 4606bdf du 2026-10-30,
#  « feat(peeks-a-hub): add aiops-agent registry entry in the cluster overrides ».
#  Message de Sébastien : « no registry entry introduces the aiops-agent
#  ApplicationSet. Add the entry in overlays/clusters/peeks-a-hub/overrides.yaml,
#  the last valueFile of this hub's cluster-addons, so only this hub gets it. »
#  => Ajouter une ENTRÉE DE REGISTRE depuis l'overlay est un mécanisme ÉPROUVÉ
#     dans ce repo, pas une acrobatie. C'est ce qui rend le cas B de KEDA sûr.
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# LA NODECLASS — servie depuis CETTE branche d'overlay
#
# POURQUOI cet addon existe : le chart platform-manifests-bootstrap n'a AUCUN
# point d'injection de NodeClass (3 templates, aucun ne rend de NodeClass), et
# rien dans gitops/ n'en rend. Il faut donc un autre véhicule.
#
# Véhicule : `repoURLGit` est surchargeable PAR ADDON — son défaut
# (`{{.metadata.annotations.addonsRepoURL}}`) est posé dans
# gitops/addons/registry/_defaults.yaml l.27, et le template de l'appset-chart
# l.143 utilise bien `$repoURLGit` pour la source de l'Application. En le
# surchargeant vers le repo de fleet-config, l'Application sert les manifestes
# bruts de cette branche.
#
# ⚠️ NON VÉRIFIABLE SANS CLUSTER — c'est le principal risque résiduel de cette
# pièce : je n'ai pas pu confirmer que l'appset-chart gère un `path` pointant un
# répertoire de manifestes BRUTS (ArgoCD le fait nativement, mais le chart
# ajoute peut-être toujours un bloc `helm:`).
# REPLI si ça ne rend pas : appliquer la NodeClass une fois à la main
#   kubectl apply -f manifests/gpu-nodeclass/nodeclass.yaml
# Aucun contrôleur ne la possède, donc rien ne la revertira. Hors GitOps, mais
# c'est UN objet, idempotent, et ça ne bloque pas la démo.
#
# ⏳ rc8 — si rc8 a ajouté un template NodeClass au chart, supprimer cet addon
# et repasser par une valeur de chart : ce serait plus propre.
# ─────────────────────────────────────────────────────────────────────────────
gpu-nodeclass-peeks:
  namespace: kube-system
  # Surcharge de la source vers CETTE branche d'overlay.
  repoURLGit: https://github.com/allamand/fleet-config-peeks-example
  repoURLGitRevision: demo/paris-2026-11-17
  repoURLGitBasePath: ""
  path: manifests/gpu-nodeclass
  annotationsAppSet:
    # Wave -2 : la NodeClass doit EXISTER avant que les NodePools la référencent
    # (custom-nodepools est rendu par platform-manifests-bootstrap, wave par
    # défaut 0). Un NodePool qui référence une NodeClass absente reste
    # NotReady et ne provisionne rien.
    argocd.argoproj.io/sync-wave: "-2"
  selector:
    matchExpressions:
      - key: enable_platform_manifests_bootstrap
        operator: In
        values: ["true"]
        # Réutilise l'interrupteur du chart qui porte les NodePools : la
        # NodeClass et les pools vont toujours ensemble, donc un seul
        # interrupteur évite un état incohérent.

# ─────────────────────────────────────────────────────────────────────────────
# KEDA — UNE SEULE VOIE : L'OVERLAY DÉFINIT L'ADDON. (le « cas A » est mort)
#
# J'avais écrit deux cas, dont un « cas A » où une seule ligne `keda: true`
# suffirait si une release amont avait mergé origin/feature/agentic-addons.
# CE CAS N'EXISTE PAS, et c'est tranché, pas supposé :
#   · KEDA est ABSENT de `main` ET de `v0.4.0-rc7` — vérifié moi-même :
#       git grep -l -i keda origin/main  -- gitops/  -> 0 fichier
#       git grep -l -i keda v0.4.0-rc7   -- gitops/  -> 0 fichier
#       git grep -l -i keda origin/feature/agentic-addons -- gitops/ -> 2
#   · et `feature/agentic-addons` a 10 commits d'avance sur main pour **1165 de
#     retard**, sans PR ouverte : elle ne sera pas fusionnée en l'état.
# => Aucune release ne nous apportera KEDA. L'overlay DOIT le définir, et c'est
#    sûr parce qu'il passe EN DERNIER (addons.yaml l.63-64), donc il peut
#    DÉFINIR un addon et pas seulement le basculer — précédent `4606bdf`.
#
# ET LA BRANCHE EST UNE RÉFÉRENCE À LIRE, PAS UNE SOURCE À RECOPIER : avec 1165
# commits de retard, son `values.yaml` est périmé. J'y ai pris les seules choses
# stables — chartName, chartRepository, namespace, wave, nom du selector — et
# j'ai VALIDÉ le reste contre le VRAI chart téléchargé
# (kedacore.github.io/charts, keda-2.19.0.tgz, values.yaml lu). C'est ce qui a
# fait apparaître l'erreur de forme corrigée ci-dessous sur `serviceAccount`.
# ─────────────────────────────────────────────────────────────────────────────
keda:
  namespace: keda                                      # = art antérieur
  chartName: keda                                      # = art antérieur
  releaseName: keda                                    # = art antérieur
  chartRepository: https://kedacore.github.io/charts    # = art antérieur
  defaultVersion: "2.19.0"
  # POURQUOI 2.19.0 et pas 2.21.0 : les deux sont publiées (index du dépôt lu le
  # 2026-11-04 : 2.21.0, 2.20.2, 2.20.1, 2.20.0, 2.19.0, 2.18.x…), et s'aligner
  # sur la version qu'un auteur PEEKS avait déjà retenue vaut mieux que prendre
  # la plus récente du jour. SURTOUT : c'est la version dont j'ai réellement lu
  # le `values.yaml`, donc la seule contre laquelle les valeurs ci-dessous sont
  # vérifiées. CE QUI CASSE si on monte : revalider la forme de `serviceAccount`
  # et `resources` sur la nouvelle version avant de changer ce champ.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
    # POURQUOI wave 3 : c'est celle que .kiro/skills/manage-addons/references/
    # sync-waves.md RÉSERVE explicitement à keda, aux côtés de
    # kube-state-metrics, prometheus-node-exporter et opentelemetry-operator.
  selector:
    matchExpressions:
      - key: enable_keda
        operator: In
        values: ["true"]
  valuesObject:
    # ═══════════════════════════════════════════════════════════════════════
    # 🎯 ÉPINGLAGE — `managed-by: peeks` AJOUTÉ le 2026-11-05.
    #    C'est le 3e pied du trépied, et l'INVERSE EXACT de ce qu'on avait fait
    #    cette nuit : on retirait le sélecteur, il fallait le rendre PLUS
    #    SPÉCIFIQUE.
    #
    # POURQUOI `node-type` SEUL NE SUFFIT PAS. Deux pools non taintés le portent
    # désormais, et un seul protège :
    #   platform-general      budget [{nodes: "10%"}] SANS schedule -> jamais bloquant
    #   general-purpose-peeks budget [{nodes:"0", schedule:"0 3 * * *", 23h}] -> 23h bloquées
    # Seul `general-purpose-peeks` porte AUSSI `managed-by: peeks`. La paire de
    # labels le désigne donc sans ambiguïté.
    #
    # ET LE `weight: 100` NE SUFFIT PAS NON PLUS — c'est la mesure qui a tranché.
    # Le poids de Karpenter n'arbitre QU'AU PROVISIONNEMENT. Un pod qui redémarre
    # produit un événement de PLANIFICATION, que kube-scheduler résout sur la
    # capacité EXISTANTE, sans jamais consulter le poids. Relevé à 09:40Z : les
    # 3 pods KEDA étaient sur `platform-general`, donc SANS fenêtre, et ils y
    # seraient restés. Le poids décide où l'on CRÉE un nœud, pas où l'on place
    # un pod.
    #
    # LE WEBHOOK VIENT EN PASSANT, et ce n'est pas un choix. Le chart KEDA n'a
    # qu'un `nodeSelector` PLAT (`.Values.nodeSelector`, utilisé 3 fois dans
    # deployment.yaml) : il n'existe aucune variante par composant, contrairement
    # à `podAnnotations` qui l'est. Les 3 pods sont donc épinglés ensemble.
    # `keda-admission-webhooks` n'a aucun besoin de la fenêtre — il ne valide que
    # les écritures de ScaledObject, et rien n'écrit pendant la démo — mais
    # l'embarquer coûte 100m/100Mi sur un nœud qui a 2620m de libre, et un
    # redémarrage de 20 s. Moins cher que de forker le chart.
    #
    # COÛT TOTAL : zéro nœud. Les 3 pods KEDA plus Grafana totalisent ~200m CPU
    # et ~512Mi, et le nœud `general-purpose-peeks` (c7i-flex.xlarge) a 3770m
    # allouables dont 1150m utilisés. Il existait déjà et était quasi vide — la
    # fenêtre interdisant de le reprendre, il coûtait 61 $ jusqu'au 18 à ne rien
    # faire. L'épinglage ne l'ajoute pas, il le rend utile.
    # ═══════════════════════════════════════════════════════════════════════
    nodeSelector:
      node-type: general-purpose
      managed-by: peeks
      # POURQUOI : les trois pools d'inférence sont taintés nvidia.com/gpu, et
      # l'opérateur KEDA n'a rien à faire sur un nœud GPU. `general-purpose` est
      # le label que porte le pool general-purpose-peeks de PEEKS.
      # CE QUI CASSE : sans ça, l'opérateur peut rester Pending si le pool
      # général intégré a été retiré (enableGeneralPurposeNodePool="false").
    # ⚠️ CORRECTION DE FORME — MÊME CLASSE DE BOGUE QUE `customNodeClasses`.
    # J'avais écrit `serviceAccount: { create: true, name: keda-operator }`.
    # **CETTE FORME N'EXISTE PAS DANS LE CHART.** Lecture du vrai values.yaml de
    # keda-2.19.0 : `serviceAccount` est nesté PAR COMPOSANT —
    #     serviceAccount:
    #       operator:      { create: true, name: keda-operator,        ... }
    #       metricServer:  { create: true, name: keda-metrics-server,  ... }
    #       webhooks:      { create: true, name: keda-webhook,         ... }
    # Mes deux clés auraient été ajoutées à côté et IGNORÉES en silence.
    # Par chance le défaut du chart est DÉJÀ `keda-operator`, donc l'association
    # Pod Identity aurait fonctionné — par accident, pas par conception.
    #
    # ✅ ET ÇA FERME L'INCONNUE DE DESIGN.md §4.4 SANS CLUSTER : le nom du SA de
    # l'opérateur est `keda-operator`, lu dans le chart. L'association Pod
    # Identity (DESIGN.md §4.3) référence le bon nom. Le `kubectl -n keda get sa`
    # reste un contrôle de confirmation, plus une inconnue bloquante.
    serviceAccount:
      operator:
        create: true
        name: keda-operator

    # `podIdentity.aws.irsa` DOIT RESTER À false (son défaut) : nous utilisons
    # **EKS Pod Identity**, pas IRSA (DESIGN.md §4.1), et Pod Identity ne demande
    # AUCUNE configuration côté chart — l'association est posée côté AWS.
    # Explicite pour empêcher qu'on « aide » en activant IRSA, ce qui ferait
    # monter un token projeté inutile et masquerait la vraie identité.
    podIdentity:
      aws:
        irsa:
          enabled: false
    resources:
      operator:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 512Mi }
      metricServer:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 512Mi }

    # ═════════════════════════════════════════════════════════════════════════
    # 📊 MÉTRIQUES PROMETHEUS DE L'OPÉRATEUR — ACTIVÉES le 2026-11-05
    #
    # LE DÉFAUT : l'opérateur tournait avec `--enable-prometheus-metrics=false`,
    # donc AUCUNE métrique `keda_*` n'existait. Mesuré : l'endpoint
    # `keda-operator-metrics-apiserver:8080` rend 257 Ko, mais ce sont 792 lignes
    # `apiserver_*`, 422 `go_*` et 310 `workqueue_*` — c'est le serveur
    # d'API agrégé, pas l'opérateur. Zéro série `keda_*`. Un dashboard KEDA
    # aurait donc été vide de façon STRUCTURELLE, et pas « en attente du 10/11 ».
    #
    # LA CLÉ, vérifiée dans le chart RÉELLEMENT épinglé (keda 2.19.0 téléchargé,
    # Chart.yaml version=2.19.0 appVersion=2.19.0), templates ET values :
    #   templates/manager/deployment.yaml:98
    #     - "--enable-prometheus-metrics={{ .Values.prometheus.operator.enabled }}"
    #   templates/manager/deployment.yaml:99-100
    #     {{- if .Values.prometheus.operator.enabled }}
    #     - "--metrics-bind-address=:{{ .Values.prometheus.operator.port }}"
    #   values.yaml : prometheus.operator.enabled = False, port = 8080
    #
    # ⚠️ LE PORT N'EST PAS 9666. Avant ce correctif le conteneur ne déclarait que
    # `('metricsservice', 9666)`, qui est le canal gRPC vers le metrics-apiserver
    # — rien à voir avec Prometheus. Les métriques `keda_*` sortent sur le port
    # de `prometheus.operator.port`, soit 8080, posé par `--metrics-bind-address`.
    #
    # Et le rendu local a corrigé une hypothèse que j'avais écrite ici : la clé
    # ne pose pas seulement le flag, elle fait AUSSI déclarer le port. Le
    # `helm template` du chart épinglé donne
    #   ports : [('metrics', 8080), ('metricsservice', 9666)]
    # là où le défaut ne donnait que le second. Le port est donc nommé et
    # scrapable, ce qui est mieux qu'un port implicite joignable seulement par
    # l'IP du pod.
    #
    # serviceMonitor laissé à false : il n'y a pas de prometheus-operator ici,
    # et le collecteur AMP managé ne lit pas les ServiceMonitor (cf. AUDIT §4.2).
    # Le scrape viendra du Scraper AMP, configuré ailleurs.
    prometheus:
      operator:
        enabled: true
        port: 8080

  # ═══════════════════════════════════════════════════════════════════════════
  # 🔧 CORRECTIF CRD — `ServerSideApply=true`, AJOUTÉ le 2026-11-05
  #
  # LE DÉFAUT : la CRD `scaledjobs.keda.sh` n'est JAMAIS créée. 5 CRD sur 6
  # seulement, et `keda-operator` reste en CrashLoopBackOff sur un type non
  # reconnu.
  #
  # MESURÉ sur l'Application `keda-paris-inference-demo` le 2026-11-05 à 18:08Z
  # — et ceci CORRIGE une note antérieure qui disait « le sync échoue en bloc » :
  #   ressources en echec : 1 / 29
  #   phase=Running  "Retrying attempt #54"  sync=OutOfSync  health=Progressing
  #   CustomResourceDefinition "scaledjobs.keda.sh" is invalid:
  #     metadata.annotations: Too long: may not be more than 262144 bytes
  # 28 ressources sur 29 sont donc bien appliquées ; SEULE la CRD échoue, et
  # l'Application retente indéfiniment (`retry.limit: -1`). L'Application n'est
  # pas bloquée en entier — c'est l'opérateur qui est inutilisable, faute du
  # type `ScaledJob` :
  #   "no matches for kind \"ScaledJob\" in version \"keda.sh/v1alpha1\""
  #   keda-operator-798fc9b664-vbpqj  0/1  CrashLoopBackOff  75 redemarrages
  #
  # LA CAUSE, mesurée : le défaut du chart (appset-chart/values.yaml:18-19) ne
  # porte que `CreateNamespace=true`. L'apply est donc côté CLIENT, et écrit
  # l'annotation `kubectl.kubernetes.io/last-applied-configuration`, plafonnée
  # à 262 144 octets. `ServerSideApply` n'écrit pas cette annotation — c'est le
  # seul levier, pas un réglage de confort.
  # Défaut amont connu : kedacore/keda#4740.
  #
  # LA PREUVE CAUSALE, mesurée le 2026-11-05 sur le chart keda 2.19.0 réellement
  # téléchargé : des 6 CRD, UNE SEULE dépasse la limite, et c'est exactement
  # celle qui manque.
  #     662 483  crd-scaledjobs.yaml                      <<< > 262 144
  #      23 158  crd-clustertriggerauthentications.yaml
  #      23 021  crd-triggerauthentications.yaml
  #      22 154  crd-scaledobjects.yaml
  #       7 555  crd-cloudeventsources.yaml
  #       7 487  crd-clustercloudeventsources.yaml
  # Les 5 autres sont 11 à 35 fois sous la limite — d'où « 5 CRD sur 6 ».
  #
  # ⚠️ CETTE CLÉ REMPLACE LE `syncPolicy` PAR DÉFAUT EN ENTIER, ELLE NE LE
  # FUSIONNE PAS. Vérifié dans le template : appset-chart/templates/
  # application-set.yaml:202-208 est un `if $chartConfig.syncPolicy / else`,
  # donc tout ce qui n'est pas réécrit ici serait PERDU. `automated` et `retry`
  # sont donc redonnés À L'IDENTIQUE du défaut lu dans values.yaml:4-19 —
  # ne pas les « simplifier », ce serait une régression silencieuse.
  #
  # UN SEUL LEVIER À LA FOIS : ne rien pousser d'autre dans le même commit,
  # sinon on ne saura pas lequel a installé la CRD.
  #
  # SI ÇA NE SUFFIT PAS : `Replace=true` au lieu de `ServerSideApply=true`.
  # Même effet sur l'annotation, mais remplacement non fusionnant — plus
  # brutal, à ne tenter qu'en second.
  #
  # RETOUR ARRIÈRE : révoquer le commit ; `selfHeal: true` ramène l'Application
  # à l'état d'avant. La CRD déjà posée SURVIT (`prune: false`), ce qui est sans
  # danger — une CRD sans CR ne fait rien — et se retire au besoin par
  # `kubectl delete crd scaledjobs.keda.sh` APRÈS avoir vérifié qu'aucun
  # ScaledJob n'existe.
  # ═══════════════════════════════════════════════════════════════════════════
  syncPolicy:
    automated:                 # ↓ identique à appset-chart/values.yaml:5-11
      selfHeal: true
      allowEmpty: true
      prune: false
    retry:                     # ↓ identique à appset-chart/values.yaml:12-17
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true   # ← le défaut, conservé
      - ServerSideApply=true   # ← LE SEUL AJOUT RÉEL de ce bloc

# ─────────────────────────────────────────────────────────────────────────────
# GRAFANA — NOTRE PROPRE ADDON, DEPUIS LE CHART UPSTREAM
#
# POURQUOI pas l'addon `grafana` de PEEKS : son chart n'a que QUATRE valeurs et
# n'en référence qu'UNE. Son `grafana.ini` est figé (`disable_login_form =
# false`, pas de `[auth.generic_oauth]`), son `env:` est explicite donc pas
# d'`envFrom`, et son Ingress est rendu SANS garde `enabled`. Il est donc
# impossible, PAR VALEURS, de lui mettre de l'OIDC ou de lui retirer son
# ingress. Toute clé qu'on y poserait serait un no-op silencieux.
#
# CE QUE CE BLOC DONNE : Grafana tourne, Sébastien le voit, et RIEN n'est
# public. Mêmes mécanique et véhicule que KEDA — une entrée de registre que
# l'overlay apporte, l'overlay passant en dernier.
#
# TOUTES LES CLÉS CI-DESSOUS SONT VÉRIFIÉES dans le values.yaml du chart
# upstream grafana/grafana 10.5.15 (téléchargé et lu) : `service`, `ingress`,
# `grafana.ini`, `datasources`, `serviceAccount`, `admin`, `persistence`,
# `nodeSelector`, `tolerations`, `resources`.
# ─────────────────────────────────────────────────────────────────────────────
grafana-paris:
  namespace: grafana-paris
  chartName: grafana
  releaseName: grafana-paris
  chartRepository: https://grafana.github.io/helm-charts
  defaultVersion: "10.5.15"
  # Dernière version publiée au 2026-11-04, et la seule dont j'ai lu le
  # values.yaml — donc la seule contre laquelle ces clés sont vérifiées.
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: "3"
  selector:
    matchExpressions:
      - key: enable_grafana_paris
        operator: In
        values: ["true"]
  valuesObject:
    # ═══ LA RAISON D'ÊTRE DE CE BLOC : AUCUNE EXPOSITION ═══
    ingress:
      enabled: false
      # Déjà le défaut du chart, posé EXPLICITEMENT : un défaut d'exposition ne
      # se laisse pas implicite dans un fichier qu'on relit avant de montrer
      # quelque chose à des clients. Pas d'Ingress -> pas de chemin sur l'ALB ->
      # pas d'URL CloudFront -> rien de public.
    service:
      type: ClusterIP
      port: 80
      # Idem : défaut du chart, rendu explicite.
    # Accès : `kubectl -n grafana-paris port-forward svc/grafana-paris 3000:80`
    # donc à travers l'endpoint EKS, authentifié en IAM.

    persistence:
      enabled: false
      # Démo éphémère : rien à conserver, et ça évite un EBS de plus à balayer
      # au teardown.

    admin:
      existingSecret: ""
      # Vide = le chart génère lui-même un mot de passe admin ALÉATOIRE dans un
      # Secret. On ne fixe AUCUN mot de passe dans ce fichier — un identifiant
      # en clair dans un livrable est exclu. Le récupérer le jour J :
      #   kubectl -n grafana-paris get secret grafana-paris \
      #     -o jsonpath='{.data.admin-password}' | base64 -d
      # ⚠️ Ce compte local est acceptable ICI et SEULEMENT ici parce que le
      # service n'est pas exposé : la porte d'entrée réelle est l'endpoint EKS
      # (IAM + access entry). Le même compte derrière une URL CloudFront
      # publique serait inacceptable — c'est précisément pourquoi l'addon
      # `grafana` de PEEKS reste à `false`.

    grafana.ini:
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
        # EXPLICITE : l'accès anonyme est refusé. C'est la clé que la
        # vérification de sortie (EXPOSURE.md §1.2) doit prouver.
      # ═══════════════════════════════════════════════════════════════════════
      # 🔑 SIGV4 DOIT ÊTRE ACTIVÉ GLOBALEMENT — AJOUTÉ le 2026-11-05
      #
      # LE DÉFAUT : la datasource portait bien `sigV4Auth: true`, le rôle IAM et
      # la pod identity association étaient en place, le token était injecté
      # (`eks-pod-identity-token`, `AWS_CONTAINER_CREDENTIALS_FULL_URI`) — et la
      # requête rendait quand même :
      #   HTTP 403  {"message":"Missing Authentication Token"}
      # C'est la réponse d'AWS à une requête NON SIGNÉE : Grafana n'appliquait
      # pas SigV4 du tout.
      #
      # LA CAUSE : `jsonData.sigV4Auth` d'une datasource est IGNORÉ tant que
      # SigV4 n'est pas activé au niveau du serveur. Lu directement dans le
      # `defaults.ini` du conteneur (Grafana 12.3.1), et non dans une
      # documentation :
      #   [auth]  sigv4_auth_enabled = false
      #           # Set to true to enable SigV4 authentication option for
      #           # HTTP-based datasources
      #   [auth]  sigv4_verbose_logging = false
      # Le `grafana.ini` en vigueur ne portait AUCUNE mention de sigv4, et la
      # section `[auth]` n'existait même pas — seulement `[auth.anonymous]`,
      # qui est une section distincte malgré le préfixe commun.
      #
      # Noter la forme : `auth:` et `auth.anonymous:` sont deux clés YAML
      # SŒURS, qui produisent deux sections ini différentes. Imbriquer
      # `anonymous` sous `auth` donnerait `[auth] anonymous.enabled`, ce qui ne
      # désactiverait plus l'accès anonyme — donc on ne regroupe pas.
      auth:
        sigv4_auth_enabled: true

    # La source de données AMP, en SigV4.
    #
    # ⬛ `<WS_ID>` SUBSTITUÉ le 2026-11-05. Le placeholder n'avait jamais été
    # remplacé, donc l'URL de la datasource était littéralement invalide : même
    # avec une authentification en place, aucune requête n'aurait abouti. Le
    # `# ⏳ cluster` qui marquait cette ligne attendait un relevé sur le cluster,
    # et le voici.
    #
    # Relevé par `aws amp list-workspaces --region eu-west-3` :
    #   ws-294f5b5c-de0f-497b-ab57-d13f3fb2736d
    #   alias  demo-paris-b-observability-amp
    #   état   ACTIVE
    #   arn    arn:aws:aps:eu-west-3:<compte>:workspace/ws-294f5b5c-…
    # Confirmé côté cluster par la CR `workspace.amp.aws.upbound.io/demo-paris-b-amg`,
    # dont le champ d'id porte la même valeur, `True True` depuis 23 h.
    #
    # ⚠️ L'AUTHENTIFICATION MANQUE ENCORE, et ce n'est pas réparable ici.
    # `sigV4AuthType: default` demande à Grafana la chaîne de credentials du SDK
    # AWS. Le pod n'en a aucune : pas de pod identity pour ce namespace (0 sur
    # les 16 du cluster), pas d'annotation `eks.amazonaws.com/role-arn` sur le
    # ServiceAccount, aucun volume `aws-iam-token`, aucune variable `AWS_*`. Il
    # faut un rôle IAM et une pod identity association — deux écritures AWS, en
    # attente de décision. Jusque-là la datasource est correctement DÉCLARÉE mais
    # répondra `403`/`no credentials`, et non `404` comme avec le placeholder :
    # la distinction compte pour diagnostiquer le 10/11.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: AMP
            type: prometheus
            access: proxy
            url: "https://aps-workspaces.eu-west-3.amazonaws.com/workspaces/ws-294f5b5c-de0f-497b-ab57-d13f3fb2736d"
            isDefault: true
            jsonData:
              httpMethod: POST
              sigV4Auth: true
              sigV4AuthType: default
              sigV4Region: eu-west-3
    serviceAccount:
      create: true
      name: grafana-paris
      # ⏳ cluster — une association Pod Identity sur CE ServiceAccount, avec la
      # MÊME politique en lecture que KEDA (DESIGN.md §4.3), scopée au seul
      # workspace :
      #   aws eks create-pod-identity-association --region eu-west-3 \
      #     --cluster-name paris-inference-demo \
      #     --namespace grafana-paris --service-account grafana-paris \
      #     --role-arn arn:aws:iam::382076407153:role/paris-demo-grafana-amp-reader
      # Sans elle, la source de données répond 403 et aucun panneau ne s'affiche.

    # 🎯 ÉPINGLAGE — `managed-by: peeks` ajouté le 2026-11-05, même raison que
    # pour `keda` (voir le bloc détaillé plus haut dans ce fichier). Ici l'enjeu
    # est le plus visible de la démo : Grafana est en `replicas: 1` avec
    # `deploymentStrategy: RollingUpdate`, donc une éviction fait DISPARAÎTRE le
    # tableau de bord de l'écran, devant 45 clients, à l'instant où l'on montre
    # la montée en charge. `node-type` seul le laisserait atterrir sur
    # `platform-general`, qui n'a aucune fenêtre de protection.
    # ⏳ Sans effet immédiat : l'Application `grafana-paris` ne rend toujours pas
    # son chart (bug amont sur `dashboards`, cf. AUDIT §5), donc aucun pod à
    # replacer aujourd'hui. L'épinglage sera actif dès qu'elle rendra.
    nodeSelector:
      node-type: general-purpose
      managed-by: peeks
      # Pas sur un nœud GPU : les trois pools d'inférence sont taintés, et
      # Grafana n'a rien à y faire.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 512Mi }

    # ═══════════════════════════════════════════════════════════════════════
    # 📊 LES TROIS TABLEAUX DE BORD DE LA DÉMO — AJOUTÉS le 2026-11-06
    #
    # POURQUOI ICI, et pas dans overlays/clusters/.../grafana/values.yaml où
    # vit le `dashboards: null` : `valuesObject` est appliqué APRÈS tous les
    # valueFiles. Le `null` du valueFile écrase la table héritée d'appmod
    # (`dashboards: {enabled: true, custom: {...}}`, qui cassait le rendu),
    # puis cette table-ci en repose une neuve, ne contenant que notre
    # provider. Les deux conceptions ont été rendues localement et comparées :
    #   dashboards ici ............... 1 ConfigMap, 0 vide, 1 volume
    #   dashboards dans le valueFile,
    #     avec enabled/custom à null .. 3 ConfigMaps, 2 vides, 3 volumes
    # pour un contenu utile identique.
    #
    # ─── PROVENANCE DES NOMS DE MÉTRIQUES ────────────────────────────────
    # RÈGLE TENUE SANS EXCEPTION : un nom n'entre dans un panneau de requête
    # que s'il a été LU dans une source citée. Les 37 noms employés par les
    # trois tableaux ont été contrôlés un par un, par programme, contre :
    #
    #   vLLM   36 noms   vllm/v1/metrics/loggers.py, tag upstream v0.10.2
    #                    (01efc7ef) — la version qu'installe
    #                    cluster-providers/common/Dockerfile.ray-vllm
    #                    (`vllm[runai]==0.10.2`). L'image ECR est taguée
    #                    `:latest` ; l'épinglage réel est dans ce Dockerfile.
    #                    Labels : `model_name`, `engine`.
    #   DCGM   26 noms   ConfigMap `exporter-metrics-config-map` (clé
    #                    `metrics`) RÉELLEMENT déployée dans `monitoring`, que
    #                    le DaemonSet monte via
    #                    `-f /etc/dcgm-exporter/default-counters.csv`. Contenu
    #                    identique aux défauts du chart 4.8.1.
    #   KEDA   13 noms   pkg/metricscollector/prommetrics.go, tag v2.19.0
    #                    (3f88d60a), opérateur port 8080. Les 2 métriques du
    #                    webhook sortent sur un autre composant : exclues.
    #
    # ⚠️ PIÈGE DCGM, à ne pas rejouer : le `values.yaml` du chart énumère 52
    #   noms `DCGM_FI_*`, mais 25 y sont COMMENTÉS et ne produiront JAMAIS de
    #   série. Seuls les 26 ACTIFS sont utilisés ici. Un tableau bâti sur les
    #   52 afficherait « No data » à jamais sur la moitié de ses panneaux.
    #
    # ⚠️ PIÈGE vLLM : quatre noms sont DÉPRÉCIÉS en 0.10.2 et volontairement
    #   NON utilisés — `gpu_cache_usage_perc` (→ `kv_cache_usage_perc`),
    #   `gpu_prefix_cache_hits` (→ `prefix_cache_hits`),
    #   `gpu_prefix_cache_queries` (→ `prefix_cache_queries`),
    #   `time_per_output_token_seconds` (→ `inter_token_latency_seconds`).
    #
    # ─── CE QUI EST VIVANT AUJOURD'HUI (mesuré dans AMP le 2026-11-06) ───
    #   keda_build_info   1 série    ← le SEUL nom confirmé vivant
    #   DCGM_FI_*         0 série    ← DaemonSet à desired=0, aucun nœud GPU
    #   vllm:*            0 série    ← aucun chemin de collecte, voir ci-dessous
    #
    # ⚠️ vLLM N'A AUCUN CHEMIN DE COLLECTE. Ce n'est pas une absence de
    #   charge, c'est une absence de scrape :
    #     - les pods `ray-service` ne portent AUCUNE annotation
    #       `prometheus.io/scrape`, donc le job `kubernetes-pods` les ignore ;
    #     - vLLM expose /metrics sur le port 8000, et le seul job par port,
    #       `polyglot_app_config`, ne garde que `:8080`.
    #   À TRANCHER AVANT LE 17/11. Les deux correctifs touchent appmod
    #   (manifeste KRO du ray-service, ou chart observability-aws), donc hors
    #   de ce commit. DCGM, lui, a un chemin VALIDE : son Service porte
    #   `prometheus.io/scrape: "true"` et `prometheus.io/port: "9400"`, que le
    #   job `kubernetes-service-endpoints` garde.
    #
    # ─── ⛔ AUCUNE ACCOLADE DOUBLE DANS CE JSON ──────────────────────────
    # CONTRAINTE DURE, decouverte en production sur le commit a2355df, qui a
    # echoue a atterrir pour cette seule raison.
    #
    # L'ApplicationSet `grafana-paris` qui genere cette Application tourne en
    # `goTemplate: true` avec `goTemplateOptions: ["missingkey=error"]`. Le
    # controleur applique donc une substitution Go template sur TOUTES les
    # chaines du spec genere -- le JSON de ces tableaux compris.
    #
    # La syntaxe de legende de Grafana, `{{label}}`, est lue par Go comme un
    # appel a une fonction `label` qui n'existe pas. Le controleur echoue sur
    #   failed to deeply replace JSON field contents: failed to parse template
    # et -- c'est le piege -- l'Application n'est PAS mise a jour : elle reste
    # figee sur la revision precedente, `Synced/Healthy`, sans que rien ne
    # paraisse casse. Seul le statut de l'ApplicationSet le dit.
    #
    # 18 occurrences (`{{gpu}}`, `{{Hostname}}`, `{{scaledObject}}`...) ont
    # bloque a2355df. Les legendes sont donc desormais soit STATIQUES, soit
    # ABSENTES -- sans legende, Grafana rend le nom de serie complet avec tous
    # ses labels, ce qui donne la meme information sans accolades.
    #
    # Le generateur /tmp/gen-dashboards.py REFUSE maintenant toute legende
    # contenant des accolades, a la generation. Si un panneau doit afficher un
    # label, en faire un panneau `table` en requete instantanee : chaque label
    # devient une colonne (c'est ce que fait le panneau de version KEDA).
    #
    # ─── PAS DE `datasource` DANS LES PANNEAUX ───────────────────────────
    # Aucun panneau ne fige d'uid. La source AMP est `isDefault: true`
    # (vérifié ci-dessus dans ce même fichier), donc Grafana la résout à la
    # requête. Figer `PD476F800710936AE` rendrait les trois tableaux muets si
    # un futur `hub:seed` le régénérait.
    #
    # Chaque tableau porte en tête un panneau « Provenance et limites » qui
    # nomme ses sources et liste ce qui reste « à confirmer le 10/11 ».
    # ═══════════════════════════════════════════════════════════════════════
    dashboards:
      peeks-paris:
        # vLLM — 12 noms employés, lus dans vllm/v1/metrics/loggers.py au tag
        # upstream v0.10.2 (01efc7ef), la version installée par Dockerfile.ray-vllm.
        peeks-paris-vllm:

# ─────────────────────────────────────────────────────────────────────────────
# devlake — POINTE SUR LE GRAFANA DU CLUSTER, PLUS SUR AMG
#
# LE DÉFAUT : l'Application `devlake-paris-inference-demo` ne se rendait PAS.
# `helm template` échouait, donc sync=Unknown et aucune ressource :
#
#   Error: execution error at (devlake/charts/devlake/templates/validate.yaml:20:4):
#     Helm test requires grafana.enabled to be true or
#     grafana.external.url to be provided
#
# LA CAUSE : `gitops/addons/configs/grafana`… non, `configs/devlake/values.yaml`
# pose `devlake.grafana.enabled: false` (ligne 2-3), et RIEN ne fournit
# `external.url` en remplacement. Le sous-chart upstream
# `apache/devlake-helm-chart 1.0.3-beta7` refuse alors de se rendre : il exige
# l'une des deux formes, pas aucune. Le valuesObject rendu confirmait l'absence :
# sa seule sous-clé `devlake` était `grafana`, sans `external`.
#
# CE QUE CETTE VALEUR FAIT : elle garde le Grafana EMBARQUÉ de DevLake coupé
# — on ne veut pas d'une seconde instance — et déclare à la place l'URL du
# Grafana qui tourne DANS le cluster, celui de l'addon `grafana-paris`.
# L'URL est le service ClusterIP de ce chart, relevé sur l'Application :
#   releaseName = grafana-paris   namespace = grafana-paris
#   service = {"port": 80, "type": "ClusterIP"}   ingress = {"enabled": false}
# d'où http://grafana-paris.grafana-paris.svc.cluster.local (port 80 implicite).
#
# C'est une URL de LIENS, pas une dépendance de démarrage : DevLake s'en sert
# pour renvoyer vers ses dashboards. Elle ne devient cliquable qu'une fois
# `grafana-paris` déployé, ce que le correctif `dashboards: null` du même
# commit débloque.
#
# POURQUOI CE TIER : `configs/*` de cet overlay serait lu par peeks-a-hub et
# peeks-b-hub, qui partagent ce dépôt. Ce fichier ne concerne que notre hub.
# ─────────────────────────────────────────────────────────────────────────────
devlake:
  grafana:
    enabled: false
    external:
      url: http://grafana-paris.grafana-paris.svc.cluster.local

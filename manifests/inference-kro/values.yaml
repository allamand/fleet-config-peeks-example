# ── Environment ───────────────────────────────────────────────────────────────
# Injected by the ApplicationSet from the cluster-secret annotations
# (aws_account_id, aws_region, aws_cluster_name, resource_prefix, aws_vpc_id,
# aws_private_subnet_ids, aws_cluster_security_group_id). NEVER set here.
env:
  accountId: ""
  region: ""
  clusterName: ""
  resourcePrefix: ""
  vpcId: ""
  privateSubnetIds: ""        # comma-separated, as in the annotation
  clusterSecurityGroupId: ""

namespace: inference

# ── Demo instance ─────────────────────────────────────────────────────────────
# Instance name = Service name: "mistral-7b" in "inference", as in the demo
# script (NS=inference, SVC=mistral-7b).
instanceName: mistral-7b

accel:
  enabled: true
  # The hub VPC already has ECR/S3 endpoints with private DNS (old stack).
  # They move into the RGD at phase 4 only (see plan-bascule-rgd.md).
  endpoints: []
  retain: true
  weights:
    prefix: mistral-7b-instruct-v0.3
    huggingFace:
      repo: mistralai/Mistral-7B-Instruct-v0.3     # Apache-2.0, not gated: no token
      revision: c170c708c41dac9275d15a8fff4eca08d52bab71
      files:                                        # no consolidated.safetensors (duplicate 14.5 GB)
      - config.json
      - generation_config.json
      - model.safetensors.index.json
      - model-00001-of-00003.safetensors
      - model-00002-of-00003.safetensors
      - model-00003-of-00003.safetensors
      - params.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer.model
      - tokenizer.model.v3
      - tokenizer_config.json
  image:
    # AWS vLLM Deep Learning Container (vLLM 0.10.2, CUDA 12.8, amd64, with
    # runai-model-streamer[s3]) through the registry-level pull-through rule
    # "ecr-public" (upstream public.ecr.aws, no credential).
    tag: 0.10.2-gpu-py312-cu129-ubuntu22.04-ec2-v1.0

service:
  enabled: true
  zoneSuffix: b                 # GPU zone: where the g6 capacity and the ODCR are
  # 0 at rest (no GPU node). Set to 1 before a rehearsal or the demo.
  floorReplicas: 0
  # true only once the ODCR is free (old floor gone): floor on the reservation.
  floorReserved: false
  reservationTags:
    ai-on-eks: "true"
  burstMaxReplicas: 2           # floor 1 + burst 2 = 3 GPU nodes at most
  burstConsolidateAfter: 10m
  cooldownPeriod: 900
  scaleDownStabilization: 900

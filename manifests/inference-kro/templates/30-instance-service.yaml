{{- if .Values.service.enabled }}
apiVersion: kro.run/v1alpha1
kind: InferenceService
metadata:
  name: {{ .Values.instanceName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  aws:
    region: {{ .Values.env.region }}
  accelRef: {{ .Values.instanceName }}
  model:
    name: mistral-7b
    weightsPrefix: mistral-7b-instruct-v0.3
    maxModelLen: 8192
    maxNumSeqs: 4
  placement:
    zones: ["{{ .Values.env.region }}{{ .Values.service.zoneSuffix }}"]
  floor:
    replicas: {{ .Values.service.floorReplicas }}
{{- if .Values.service.floorReserved }}
    # Floor on the ODCR, selected by tag (never by ID). A NodeClass that
    # declares reservation terms changes ODCR usage for the whole Auto Mode
    # cluster: only enable once the old floor has released the reservation.
    capacityTypes: ["reserved", "on-demand"]
    reservationTags: {{ .Values.service.reservationTags | toJson }}
    instanceTypes: ["g6.2xlarge"]
{{- else }}
    # On-demand while the ODCR slot is held elsewhere. g6.2xlarge on-demand is
    # often ICE in this zone, hence the larger sizes.
    capacityTypes: ["on-demand"]
    instanceTypes: ["g6.2xlarge", "g6.4xlarge", "g6.8xlarge"]
{{- end }}
    maxNodes: 1
  burst:
    enabled: true
    minReplicas: 0
    maxReplicas: {{ .Values.service.burstMaxReplicas }}
    # `spot` RETIRÉ le 2026-11-12, sur mesure du quota. Le compte dispose de
    # 768 vCPU en on-demand G mais de seulement **64 vCPU en spot G** :
    #   aws service-quotas get-service-quota --service-code ec2 --quota-code L-3819A6DF
    # Trois g6.16xlarge en spot demanderaient 192 vCPU, soit trois fois le
    # quota. Karpenter aurait donc basculé sur on-demand ou sur des tailles
    # plus petites, SANS message : le coût et le chrono de la démonstration
    # auraient dépendu d'un arbitrage invisible en scène.
    # À remettre dès que le quota spot est relevé au-delà de 192 vCPU.
    capacityTypes: ["on-demand"]
    instanceTypes: ["g6.4xlarge", "g6.8xlarge", "g6.16xlarge"]
    maxNodes: {{ .Values.service.burstMaxReplicas }}
    consolidateAfter: {{ .Values.service.burstConsolidateAfter }}
  scaling:
    ampWorkspaceRef: {{ .Values.env.resourcePrefix }}-amp
    threshold: "2"
    activationThreshold: "1"
    cooldownPeriod: {{ .Values.service.cooldownPeriod }}
    scaleDownStabilization: {{ .Values.service.scaleDownStabilization }}
{{- end }}

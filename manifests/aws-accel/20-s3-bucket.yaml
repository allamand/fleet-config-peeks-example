# ─────────────────────────────────────────────────────────────────────────────
# Bucket S3 privé pour les poids du modèle — piste 1, le plus gros gain
# attendu de la note (−190 à −220 s sur les 250 s mesurées).
#
# POURQUOI : les poids sont aujourd'hui téléchargés depuis huggingface.co à
# chaque démarrage de réplique. Mesuré le 06/11 : 250 s, soit 0,46 Gbps — 9 %
# de la bande passante de base d'une g6.2xlarge. Le trafic sort par le NAT.
# Référence AWS sur ce goulot précis : « during a scale up event, several nodes
# downloading the full model at once contend for the same NAT Gateway
# bandwidth » (EKS User Guide, « Accelerate model loading on Amazon EKS »).
#
# GAIN SECOND, ET IL COMPTE AUTANT : plus aucune dépendance à huggingface.co
# pendant la démonstration.
#
# LE GATEWAY S3 EST LE PRÉREQUIS, et il est déjà posé (12-vpce-s3-gateway).
# Sans lui on déplacerait le goulot sans le lever.
#
# ⚠ CE QUI SERA COPIÉ, ET CE QUI NE LE SERA PAS. Le dépôt HuggingFace publie
# les mêmes poids SOUS DEUX FORMES, relevées par l'API :
#   consolidated.safetensors            13,50 Gio   ← format Mistral, EXCLU
#   model-0000{1,2,3}-of-00003.safetensors 13,50 Gio ← format HF, COPIÉ
# Soit 27,00 Gio au total si l'on prenait tout. `runai_streamer` lit le format
# HF sharded et son `model.safetensors.index.json`. Copier aussi le fichier
# consolidé doublerait le transfert ET risquerait que le chargeur le choisisse.
# Seuls les 3 shards et les 8 fichiers auxiliaires sont copiés : 13,50 Gio.
#
# AUCUN NUMÉRO DE COMPTE N'APPARAÎT : un ARN S3 n'en porte pas
# (`arn:aws:s3:::<bucket>`), contrairement à une URL ECR. La piste 1 n'a donc
# pas le problème de la piste 2.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: peeks-paris-demo-models
  namespace: paris-inference-demo
  labels:
    managed-by: peeks
  annotations:
    services.k8s.aws/region: eu-west-3
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/deletion-policy: retain
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  name: peeks-paris-demo-models
  createBucketConfiguration:
    # OBLIGATOIRE hors us-east-1 : sans cette contrainte, S3 crée le bucket
    # dans us-east-1 — et la consigne interdit toute ressource hors eu-west-3.
    locationConstraint: eu-west-3
  # Block Public Access COMPLET, les quatre interrupteurs.
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  encryption:
    rules:
      - applyServerSideEncryptionByDefault:
          # `sseAlgorithm`, et non `sSEAlgorithm` : j'avais écrit la seconde
          # forme et le `dry-run=server` l'a refusée — « unknown field
          # spec.encryption.rules[0].applyServerSideEncryptionByDefault.sSEAlgorithm ».
          # Le nom exact est relevé dans le schéma du CRD, pas deviné.
          sseAlgorithm: AES256
        # bucketKeyEnabled ne s'applique qu'à SSE-KMS : laissé absent.
  # AUCUNE `policy` : le bucket reste privé et l'accès passe uniquement par
  # l'IAM de l'appelant (voir 30-iam-role-vllm-s3.yaml). Une politique de
  # bucket serait une seconde surface à auditer pour aucun bénéfice.
  tagging:
    tagSet:
      - key: owner
        value: sallaman
      - key: purpose
        value: aws-experience-paris-2026-11-17
      - key: managed-by
        value: ack
      - key: auto-delete
        value: "no"

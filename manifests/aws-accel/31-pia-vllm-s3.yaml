# ─────────────────────────────────────────────────────────────────────────────
# Association d'identité de pod : ns `vllm`, SA `vllm-s3-reader` -> le rôle
# ci-dessus. Piste 1.
#
# PAS D'ANNOTATION `adoption-fields`, ET C'EST ÉTABLI. Le chart
# `ack-pod-identity` d'appmod le documente à la révision épinglée 68fccbcc :
#   « VERIFIED 2026-08-24: adopt-or-create ALONE adopts a pre-existing
#     association. ACK looks PodIdentityAssociation up by clusterName +
#     namespace + serviceAccount (ListPodIdentityAssociations filters), NOT by
#     the AWS-generated associationID, so no adoption-fields are required or
#     possible here. »
# La clé naturelle suffit, et le `spec` ci-dessous la porte. Les 9 associations
# vivantes du cluster le confirment : aucune ne porte d'`adoption-fields`.
#
# `roleRef` PLUTÔT QUE `roleARN` : la référence au CR `Role` laisse ACK
# résoudre l'ARN quand le rôle est synchronisé, ce qui donne l'ordre
# correct gratuitement — en plus du `sync-wave`. Et cela évite d'écrire un ARN
# IAM, qui PORTERAIT le numéro de compte, dans un dépôt public.
#
# AUCUNE association n'existait pour le namespace `vllm` — relevé sur les 9
# associations du cluster avant d'écrire.
#
# SUPPRESSION : `retain`. Supprimer ce CR ne coupe pas l'identité d'un pod en
# cours d'exécution.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: paris-inference-demo-vllm-s3-pod-identity
  namespace: paris-inference-demo
  labels:
    managed-by: peeks
  annotations:
    services.k8s.aws/region: eu-west-3
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/deletion-policy: retain
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Vague -1 : après le rôle (-2), avant tout ce qui consomme l'identité.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterName: paris-inference-demo
  namespace: vllm
  serviceAccount: vllm-s3-reader
  roleRef:
    from:
      name: paris-inference-demo-vllm-s3-role
  tags:
    managed-by: peeks
    purpose: vllm-s3-weights-read

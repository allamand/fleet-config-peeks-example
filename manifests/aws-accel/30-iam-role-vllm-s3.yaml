# ─────────────────────────────────────────────────────────────────────────────
# Rôle IAM en LECTURE SEULE sur le seul préfixe des poids — piste 1.
#
# CRÉÉ PAR ACK, pas à la main : c'est la préférence explicite, et la capability
# ACK en a le droit (IAMRoleSelector `iam-paris-inference-demo` ->
# demo-paris-b-cluster-mgmt-iam, simulation IAM `allowed`).
#
# À QUI IL SERT, ET À QUI IL NE SERT PAS. Le pod vLLM n'avait AUCUN
# `serviceAccountName` : il tournait sous le `default` du namespace. Associer
# l'identité à `default` l'aurait donnée à tout pod du namespace. Un
# ServiceAccount dédié `vllm-s3-reader` est donc créé (voir
# ../vllm/05-serviceaccount.yaml) et c'est LUI que l'association cible.
#
# PÉRIMÈTRE DE LA POLITIQUE, et le compromis assumé :
#   · `s3:GetObject` est limité au préfixe du modèle, pas au bucket entier ;
#   · `s3:ListBucket` porte sur le bucket SANS condition de préfixe. Une
#     condition `s3:prefix` est tentante, mais `runai_streamer` et le SDK
#     énumèrent de plusieurs façons et une condition mal calibrée produit un
#     échec difficile à diagnostiquer. À dix jours de la démonstration, je
#     préfère un périmètre sûr au niveau des OBJETS — qui est ce qui compte —
#     plutôt qu'une restriction d'énumération fragile.
#   · `s3:GetBucketLocation` est inclus : le SDK AWS l'appelle pour résoudre la
#     région, et son absence se manifeste par une erreur sans rapport apparent.
#   · AUCUNE action d'écriture. Aucune action sur un autre bucket.
#
# AUCUN ARN DE COMPTE ICI : les ARN S3 n'en portent pas.
#
# SUPPRESSION : `retain`. Supprimer ce CR ne supprime pas le rôle.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: paris-inference-demo-vllm-s3-role
  namespace: paris-inference-demo
  labels:
    managed-by: peeks
  annotations:
    services.k8s.aws/region: eu-west-3
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/deletion-policy: retain
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Vague -2 : le rôle doit exister avant l'association qui le référence.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  name: paris-inference-demo-vllm-s3-role
  path: /
  maxSessionDuration: 3600
  description: "Lets the vLLM pods (ns vllm, SA vllm-s3-reader) stream the Mistral-7B weights from the peeks-paris-demo-models bucket. Read-only, single prefix."
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "AllowEksPodIdentity",
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": [
            "sts:AssumeRole",
            "sts:TagSession"
          ]
        }
      ]
    }
  inlinePolicies:
    s3-read-mistral-weights: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ReadModelObjectsOnly",
            "Effect": "Allow",
            "Action": [
              "s3:GetObject"
            ],
            "Resource": "arn:aws:s3:::peeks-paris-demo-models/mistral-7b-instruct-v0.3/*"
          },
          {
            "Sid": "ListAndLocateThisBucketOnly",
            "Effect": "Allow",
            "Action": [
              "s3:ListBucket",
              "s3:GetBucketLocation"
            ],
            "Resource": "arn:aws:s3:::peeks-paris-demo-models"
          }
        ]
      }
  tags:
    - key: owner
      value: sallaman
    - key: purpose
      value: aws-experience-paris-2026-11-17
    - key: managed-by
      value: ack

# ─────────────────────────────────────────────────────────────────────────────
# Endpoint VPC d'interface pour le registre ECR (protocole Docker) — piste 2.
# Voir 10-vpce-ecr-api.yaml pour le raisonnement complet : les trois
# endpoints ne valent que pris ensemble.
#
# C'est celui-ci qui porte le TRANSFERT du manifeste et des descripteurs de
# couches ; les octets des couches, eux, passent par le gateway S3 (12-).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: VPCEndpoint
metadata:
  name: vpce-ecr-dkr
  namespace: paris-inference-demo
  labels:
    managed-by: peeks
  annotations:
    services.k8s.aws/region: eu-west-3
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/deletion-policy: retain
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vpcID: vpc-0fa7dd0efd5a25eb4
  serviceName: com.amazonaws.eu-west-3.ecr.dkr
  vpcEndpointType: Interface
  privateDNSEnabled: true
  subnetIDs:
    - subnet-096c17d8ce9bef35b   # eu-west-3b, 10.60.12.0/24 — les nœuds GPU
    - subnet-05de189b86c96aa58   # eu-west-3a, 10.60.11.0/24
  securityGroupIDs:
    - sg-05897eaa10705f2ea       # eks-cluster-sg, règle -1 depuis lui-même
  tags:
    - key: owner
      value: sallaman
    - key: purpose
      value: aws-experience-paris-2026-11-17
    - key: managed-by
      value: ack
    - key: auto-delete
      value: "no"

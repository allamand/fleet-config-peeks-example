# ─────────────────────────────────────────────────────────────────────────────
# Deployment du DEBORDEMENT — seul mis a l'echelle par KEDA
#
# POURQUOI DEUX DEPLOYMENTS, ET PAS UN SEUL AVEC UNE AFFINITE PREFEREE.
# Le 07/11, la descente de 2 a 1 replique a supprime le pod du PLANCHER et
# gardé celui du debordement : l'ODCR tournait a vide et le nœud on-demand
# ne partait plus. La cause est dans le code du controleur de ReplicaSet,
# `ActivePodsWithRanks.Less` (pkg/controller/controller_utils.go) :
#
#    4. If controller.kubernetes.io/pod-deletion-cost annotation is set, then
#       the pod with the lower value will come first.
#    6. ... the pod that has been ready for a shorter amount of time comes first
#    8. ... the pod that was created more recently comes before the older pod
#
#    In 6 and 8, times are compared in a LOGARITHMIC scale. This allows a level
#    of randomness among equivalent Pods when sorting. If two pods have the same
#    logarithmic rank, they are sorted by UUID to provide a pseudorandom order.
#
# Trois conclusions, toutes verifiees dans ce code :
#  · L'AFFINITE N'APPARAIT DANS AUCUNE des 8 regles. Elle gouverne le
#    placement, jamais la suppression. Une affinite « preferee » vers le
#    plancher ne protege donc rien.
#  · `pod-deletion-cost` (regle 4) agit AVANT le tirage logarithmique, donc il
#    protegerait — mais il se lit dans les ANNOTATIONS DU POD. Depuis un
#    template unique, tous les pods portent la meme valeur, `pi != pj` est
#    faux, et la regle ne discrimine rien.
#  · Nos deux pods etaient prets depuis 34 et 18 min, donc dans le MEME seau
#    logarithmique : le depart s'est fait par UUID, au hasard. Ce n'etait pas
#    un aleas a rejouer, c'est une piece de monnaie a chaque descente.
#
# D'ou la separation : deux Deployments, deux ReplicaSets, donc deux listes de
# candidats a la suppression DISJOINTES. KEDA ne met a l'echelle que le
# debordement ; le plancher est hors de sa portee et ne peut plus etre choisi.
#
# CE QUI NE CHANGE PAS, et c'est deliberé :
#  · le Service `vllm-mistral` selectionne `app.kubernetes.io/name`, donc il
#    sert les pods des DEUX Deployments sans modification ;
#  · `--served-model-name mistral-7b` est identique des deux cotes, donc les
#    trois tableaux Grafana et le declencheur KEDA restent muets de ce
#    changement ;
#  · l'image, les poids S3, les sondes et les ressources sont rigoureusement
#    ceux du Deployment unique — ces deux fichiers en sont DERIVES par script,
#    pas recopies a la main.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral-burst
  namespace: vllm
  labels:
    app.kubernetes.io/name: vllm-mistral
    managed-by: peeks
    inference-role: burst
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🩹 AUCUN `replicas` ICI, ET C'EST VOULU — 2026-11-07
  #
  # Ce champ appartient à KEDA. Il était fixé à 0, et Argo CD le ramenait donc
  # à 0 par `selfHeal` dès que KEDA le levait. MESURÉ : l'exécuteur d'échelle
  # de KEDA a réécrit `Original 0 -> New 1` CINQ FOIS DE SUITE, au pas de 15 s
  # de son `pollingInterval` (17:18:45Z à 17:19:45Z), Argo remettant 0 derrière
  # lui à chaque passage ; la synchronisation de `17:20:30Z` a ensuite ramené
  # `replicas` de 3 à 0. Témoin direct : une montée à la main à 1 a été remise
  # à 0 en CINQ SECONDES.
  #
  # Une réplique de débordement a besoin d'environ trois minutes pour charger
  # son modèle sur un nœud neuf. Elle en obtenait cinq secondes : AUCUNE ne
  # pouvait servir. C'est la cause unique de tous les tests de débordement
  # restés sans réplique servie — y compris ceux dont l'échec avait été imputé
  # à la capacité AWS.
  #
  # RETIRER LE CHAMP, plutôt que l'exempter dans l'Application : c'est la
  # recommandation d'Argo CD pour toute charge pilotée par une HPA. Sans champ
  # dans le manifeste, Argo n'a plus rien à réconcilier et ne peut plus entrer
  # en conflit. Le plancher, lui, GARDE son `replicas: 1` dans git : il n'est
  # pas piloté par KEDA, et une dérive dessus DOIT être corrigée.
  #
  # ⚠ EFFET DE BORD À LA PREMIÈRE SYNCHRONISATION, et à lui seul. Argo est en
  # apply CLIENT-SIDE ici (aucun `ServerSideApply=true` dans les syncOptions),
  # et `replicas: 0` figure dans l'annotation `last-applied-configuration`
  # vivante. La fusion à trois voies va donc SUPPRIMER le champ, et l'API
  # appliquera sa valeur par défaut, soit 1 — une seule fois. KEDA, dont le
  # déclencheur est inactif et le `cooldownPeriod` déjà écoulé, le ramène à 0
  # au sondage suivant. Les synchronisations ultérieures ne touchent plus rien,
  # le champ ayant quitté `last-applied-configuration`.
  # ═══════════════════════════════════════════════════════════════════════════
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-mistral
      inference-role: burst
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-mistral
        managed-by: peeks
        inference-role: burst
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: inference-tier
                operator: In
                values:
                - burst
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vllm-mistral
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 60
      serviceAccountName: vllm-s3-reader
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.10.2
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - s3://peeks-paris-demo-models/mistral-7b-instruct-v0.3/
        - --load-format
        - runai_streamer
        - --model-loader-extra-config
        - '{"concurrency":4}'
        - --served-model-name
        - mistral-7b
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --max-model-len
        - '8192'
        - --max-num-seqs
        - '4'
        - --gpu-memory-utilization
        - '0.90'
        - --enable-prefix-caching
        - --disable-log-requests
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: HF_HOME
          value: /cache/huggingface
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: RUNAI_STREAMER_CHUNK_BYTESIZE
          value: '4294967296'
        - name: RUNAI_STREAMER_S3_REQUEST_TIMEOUT_MS
          value: '3000'
        - name: RUNAI_STREAMER_S3_LOW_SPEED_LIMIT
          value: '1048576'
        - name: AWS_REGION
          value: eu-west-3
        - name: AWS_DEFAULT_REGION
          value: eu-west-3
        resources:
          limits:
            nvidia.com/gpu: '1'
            memory: 24Gi
          requests:
            nvidia.com/gpu: '1'
            cpu: '4'
            memory: 16Gi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 150
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 10
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 60Gi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi

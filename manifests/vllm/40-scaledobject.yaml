# ─────────────────────────────────────────────────────────────────────────────
# ScaledObject — la mise à l'échelle de la démo.
#
# ═══ PARAMÈTRES, TELS QUE TRANCHÉS ═══════════════════════════════════════════
# `maxReplicaCount: 4`, conformément à la planche 16 : la démonstration doit
# montrer la montée jusqu'à 4 répliques, pas 2.
# `minReplicaCount: 1` : le plancher reste servi en permanence, sur le nœud de
# la réservation de capacité, qui est déjà payée.
#
# ═══ TOUTES LES CLÉS SONT VÉRIFIÉES À LA SOURCE ══════════════════════════════
# Lues dans `pkg/scalers/prometheus_scaler.go` au tag v2.19.0 (3f88d60a) :
#   serverAddress  l.43  obligatoire
#   query          l.44  obligatoire
#   threshold       l.46  obligatoire
#   activationThreshold l.47  optionnel
#   awsRegion      l.52  optionnel
#   ignoreNullValues l.50 porte `default=true`
# Aucune clé n'est inventée, et aucune n'est reprise d'une documentation.
#
# ═══ L'ARITHMÉTIQUE DU SEUIL, QUI DÉTERMINE LA CHARGE À ENVOYER ══════════════
# KEDA construit une métrique HPA de type AverageValue : le nombre de
# répliques visé est `ceil(valeur_de_la_requête / threshold)`.
# Avec `threshold: "2"` :
#       4 en attente → 2 répliques
#       6 en attente → 3 répliques
#       8 en attente → 4 répliques  ← le plafond
# Et comme chaque réplique ne sert que 4 requêtes simultanément
# (`--max-num-seqs 4`), une charge de 40 requêtes concurrentes laisse ~36 en
# attente dès la première réplique, ce qui demande le plafond tout de suite.
# La charge du test doit donc être soutenue ASSEZ LONGTEMPS pour que les 4
# répliques aient le temps de démarrer — plusieurs minutes, puisque chaque
# nouvelle réplique télécharge image et poids.
#
# ═══ POURQUOI `sum(...)` ET PAS LA MÉTRIQUE BRUTE ════════════════════════════
# `vllm:num_requests_waiting` est étiquetée par `model_name` et `engine`
# (`loggers.py:168`), et le scrape ajoute `pod`, `namespace`, etc. Sans
# agrégation, la requête rendrait PLUSIEURS séries et KEDA refuserait le
# résultat. `sum(...)` rend une valeur unique : la file totale, qui est bien la
# grandeur à répartir entre les répliques.
#
# ═══ DESCENTE ════════════════════════════════════════════════════════════════
# La fenêtre de stabilisation par défaut de la HPA en descente est de 300 s.
# Pour un test dont le budget total est inférieur à 30 minutes, cela mangerait
# cinq minutes de simple attente. Elle est donc ramenée à 60 s, et la descente
# est autorisée par paliers de 1 réplique toutes les 60 s — assez lent pour
# être observable à l'écran, assez rapide pour tenir dans le budget.
#
# ⛔ CE SCALEDOBJECT EST INERTE TANT QUE L'IDENTITÉ AWS DE KEDA N'EXISTE PAS.
#   Voir `30-triggerauthentication.yaml` : il n'y a aujourd'hui aucune pod
#   identity association dans le namespace `keda`. Sans elle, la requête vers
#   AMP n'est pas signée, AMP rend 403, et aucune mise à l'échelle n'a lieu.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-mistral
  namespace: vllm
  labels:
    managed-by: peeks
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🩹 KEDA NE PILOTE PLUS QUE LE DÉBORDEMENT — 2026-11-07
  #
  # AVANT : un seul Deployment `vllm-mistral`, min 1 / max 4. La descente de 2
  # à 1 réplique a supprimé le pod du PLANCHER et gardé celui du débordement :
  # l'ODCR tournait à vide et le nœud on-demand ne partait plus, puisqu'un pool
  # en `WhenEmpty` ne retire que les nœuds vides.
  #
  # LA CAUSE EST DANS LE CODE, pas dans un réglage. `ActivePodsWithRanks.Less`
  # (pkg/controller/controller_utils.go) classe les candidats à la suppression
  # en 8 règles, et aucune ne connaît l'affinité. Les règles 6 et 8 comparent
  # les temps « in a LOGARITHMIC scale … If two pods have the same logarithmic
  # rank, they are sorted by UUID to provide a pseudorandom order ». Nos deux
  # pods étaient prêts depuis 34 et 18 min, donc dans le même seau : le
  # départage s'est fait **par UUID**. Ce n'était pas un aléa à rejouer.
  #
  # LA SÉPARATION EST LE SEUL REMÈDE DÉCLARATIF. Deux Deployments donnent deux
  # ReplicaSets, donc deux listes de candidats DISJOINTES. Le plancher sort
  # définitivement de la portée de KEDA.
  #
  # L'ENVELOPPE EST INCHANGÉE : 1 réplique de plancher, fixe, plus 0 à 3 de
  # débordement = 1 à 4 au total, exactement comme avant.
  #
  # `minReplicaCount: 0` est désormais possible ET souhaitable : au repos il
  # n'y a plus aucune réplique de débordement, donc plus aucun nœud
  # on-demand payé à vide. L'activation depuis zéro repose sur
  # l'`activationThreshold` du déclencheur, déjà posé à "1" plus bas.
  # ═══════════════════════════════════════════════════════════════════════════
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-mistral-burst
  minReplicaCount: 0
  maxReplicaCount: 3
  # 15 s : assez court pour que la réaction soit visible, mais ce n'est PAS le
  # facteur limitant. La chaîne complète est
  #   vLLM /metrics → intervalle de scrape du collecteur → AMP
  #                 → pollingInterval → HPA → pod → Karpenter → nœud
  # et le scrape du collecteur domine ce premier tronçon. C'est l'un des temps
  # que le test doit chiffrer.
  pollingInterval: 15
  # ═══════════════════════════════════════════════════════════════════════════
  # 🩹 120 s -> 900 s, LE 2026-11-07 : LA DESCENTE A DEUX CHEMINS
  #
  # La fenêtre de 900 s posée au commit `fd08af6` ne couvre QU'UN des deux, et
  # le test R2 l'a rendu visible.
  #
  #   de `max` vers `minReplicas` du HPA (= 1, car un HPA ne peut pas valoir 0)
  #       -> gouverné par behavior.scaleDown.stabilizationWindowSeconds = 900 s
  #   de 1 vers 0
  #       -> gouverné par KEDA LUI-MÊME, hors HPA, après `cooldownPeriod`
  #
  # Tant que `minReplicaCount` valait 1, le second chemin n'existait pas et
  # 120 s était sans conséquence. En passant le débordement à
  # `minReplicaCount: 0` — ce qui est souhaitable, puisque au repos il n'y a
  # plus aucun nœud on-demand payé à vide — on a ouvert un chemin de descente
  # que la protection ne couvrait pas.
  #
  # CE QUE ÇA EXPOSAIT : la DERNIÈRE réplique de débordement, seule et en
  # train de charger son modèle, pouvait être supprimée 120 s après que la
  # file soit retombée sous le seuil d'activation — exactement le mode d'échec
  # du 06/11, où les quatre répliques ont été tuées pendant le chargement.
  # Le démarrage à froid mesuré le 07/11 est de 70 s sur nœud chaud mais de
  # ~256 s sur nœud neuf, capacité mise à part : 120 s ne suffit pas.
  #
  # 900 s ALIGNE LES DEUX CHEMINS sur la même valeur, celle qui est déjà
  # justifiée par la mesure : pire démarrage à froid de 588 s, donc 1,53x de
  # marge.
  #
  # CE QUE J'AI MESURÉ ET QUE JE N'EXPLIQUE PAS : au test R2, le débordement
  # est retombé à 0 en 48 s après la coupure de charge — moins que les 120 s
  # d'alors. Je n'ai pas l'instant exact où la file est repassée sous le seuil
  # (les répliques de débordement n'ont jamais été prêtes, donc elles ne
  # publiaient aucune métrique), donc je ne peux pas attribuer ces 48 s à un
  # réglage. Ce commit traite le chemin, pas cette anomalie, qui reste à
  # élucider au prochain test où une réplique de débordement sera réellement
  # servie.
  #
  # COÛT ASSUMÉ, identique à celui de la fenêtre : après une rafale, la
  # dernière réplique de débordement reste 15 min. Sur une démo de 22 min
  # c'est voulu. Hors démo, réglage à redescendre avec la fenêtre.
  # ═══════════════════════════════════════════════════════════════════════════
  cooldownPeriod: 900
  advanced:
    # On NE restaure PAS le nombre de répliques d'origine à la suppression :
    # pendant le test, une suppression accidentelle du ScaledObject ne doit pas
    # provoquer en plus un mouvement de répliques non voulu.
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
        scaleDown:
          # ═════════════════════════════════════════════════════════════════
          # 🩹 60 s -> 900 s, LE 2026-11-07, SUR LA CAUSE MESURÉE DU TEST R0bis
          #
          # CETTE VALEUR ÉTAIT LA CAUSE DE L'ÉCHEC, pas un réglage de confort.
          # Le test du 06/11 n'a jamais fait servir une réplique de
          # débordement : les quatre ont été supprimées PENDANT le chargement
          # du modèle. La chronologie mesurée est sans ambiguïté —
          #   23:12:38–23:13:02  les 3 conteneurs de débordement démarrent
          #   23:16:18           la HPA redescend à 3 répliques
          #   23:17:18           une deuxième réplique est supprimée
          #   ~23:18:30          la dernière part
          #   23:18:20–23:18:40  l'instant où elles auraient servi
          # Elles ont été tuées à une vingtaine de secondes du but, et la
          # preuve que AUCUNE n'a abouti est que `readyReplicas` vaut 1 sur
          # les 74 relevés de la descente, sans exception.
          #
          # POURQUOI 60 s NE POUVAIT PAS MARCHER : la file
          # `vllm:num_requests_waiting` se vide dès que la charge s'arrête,
          # bien avant que les répliques neuves ne soient prêtes. La fenêtre
          # de stabilisation doit donc couvrir le DÉMARRAGE À FROID complet,
          # pas la durée de la rafale.
          #
          # POURQUOI 900 s : le pire démarrage à froid mesuré est de 588 s
          # entre la création du pod et le modèle servi (tour 4, plancher).
          # 900 s laisse 312 s de marge, soit 1,53x le mesuré. C'est aussi la
          # valeur que recommande [[scaling-patterns-eks-inference]], donc la
          # seule des trois corrections de l'étape 0 qui soit citée et non
          # déduite.
          #
          # CE QUE ÇA COÛTE, ET C'EST ASSUMÉ : après une rafale, les répliques
          # de débordement restent 15 min. Sur une démo de 22 min, c'est
          # voulu — on veut qu'elles restent à l'écran. Hors démo, c'est un
          # réglage à redescendre.
          #
          # À MESURER AU PROCHAIN TEST (point 8 de la note) : vider la file
          # pendant le chargement et vérifier qu'aucune réplique ne part.
          # ═════════════════════════════════════════════════════════════════
          stabilizationWindowSeconds: 900
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      authenticationRef:
        name: amp-sigv4
      metadata:
        # Point d'entrée de requête de l'espace AMP. C'est la même URL que
        # celle que la source de données Grafana interroge avec succès depuis
        # le commit 76b9df0 — donc une adresse vérifiée, pas supposée.
        serverAddress: https://aps-workspaces.eu-west-3.amazonaws.com/workspaces/ws-294f5b5c-de0f-497b-ab57-d13f3fb2736d
        query: sum(vllm:num_requests_waiting)
        threshold: "2"
        # En dessous de 1 en attente, le trigger est INACTIF. Cela évite que du
        # bruit à 0 maintienne des répliques inutiles, et laisse le plancher
        # redescendre proprement à 1 à la fin du test.
        activationThreshold: "1"
        awsRegion: eu-west-3
        # Explicite, bien que ce soit le défaut (`default=true`, l.50) : tant
        # qu'aucune réplique n'a servi de requête, la série n'existe pas et AMP
        # rend un résultat vide. Sans cette tolérance, KEDA traiterait ce vide
        # comme une ERREUR au lieu d'un zéro, et le ScaledObject tomberait en
        # échec au tout début du test — précisément au moment le plus visible.
        ignoreNullValues: "true"

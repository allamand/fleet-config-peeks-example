# ─────────────────────────────────────────────────────────────────────────────
# Deployment vLLM — Mistral-7B, 1 GPU par réplique.
#
# ═══ IMAGE ═══════════════════════════════════════════════════════════════════
# `vllm/vllm-openai:v0.10.2`, et pas l'image ECR du manifeste Ray.
#   · le dépôt ECR attendu par le ray-service (`<préfixe>-ray-vllm-custom`)
#     N'EXISTE PAS dans ce compte — vérifié par `aws ecr
#     describe-repositories`, qui ne rend que 4 dépôts sans rapport ;
#   · `v0.10.2` est EXACTEMENT la version qu'épingle
#     `cluster-providers/common/Dockerfile.ray-vllm` (`vllm[runai]==0.10.2`).
#     L'épinglage réel de la démo est dans ce Dockerfile, pas dans le tag
#     d'image, qui est `:latest`.
#   · tag vérifié présent sur Docker Hub : amd64/linux, 11,5 Go.
#
# ⚠️ 11,5 Go à tirer au premier démarrage d'un nœud neuf. C'est le premier
#   contributeur au temps « pod Pending → modèle servi ». Le chart
#   `image-prepuller` existe dans appmod et c'est la réponse prévue ; il n'est
#   pas activé ici.
#
# ═══ MODÈLE ══════════════════════════════════════════════════════════════════
# `mistralai/Mistral-7B-Instruct-v0.3`. Vérifié NON *gated* sur l'API
# HuggingFace (`gated=False`), donc AUCUN jeton n'est nécessaire — et il n'en
# existe aucun, ni dans les secrets du cluster ni dans Secrets Manager.
#
# ⚠️ ~15 Go de poids téléchargés au démarrage de CHAQUE réplique : le cache est
#   un `emptyDir`, donc propre à chaque pod. Il n'y a pas de cache S3 partagé
#   (le bucket de modèles est absent). C'est le second contributeur au temps de
#   mise en service, et il se paie à chaque montée en charge.
#
# ═══ DIMENSIONNEMENT, ET POURQUOI IL FAIT LA DÉMO ════════════════════════════
# g6.2xlarge = 1 GPU L4, 24 Go de mémoire vidéo.
#   Mistral-7B en fp16 ≈ 14,5 Go de poids. Avec
#   `--gpu-memory-utilization 0.90` → ~21,6 Go utilisables, dont ~7 Go pour le
#   cache KV. Mistral-7B : 32 couches, 8 têtes KV, head_dim 128
#   → 2 (K+V) × 8 × 128 × 2 octets × 32 couches = 128 KiB par jeton.
#   `--max-model-len 8192` × `--max-num-seqs 4` = 32 768 jetons ≈ 4 Go. Marge
#   confortable.
#
# `--max-num-seqs 4` est un choix de DÉMONSTRATION, pas de performance : au
# delà de 4 requêtes simultanées, une réplique met les suivantes EN FILE, et
# c'est précisément `vllm:num_requests_waiting` qui monte — le signal sur
# lequel KEDA déclenche. Une valeur plus haute rendrait la mise à l'échelle
# difficile à provoquer devant 45 personnes.
#
# ═══ PLACEMENT ═══════════════════════════════════════════════════════════════
# Les trois NodePool d'inférence portent le taint `nvidia.com/gpu:NoSchedule`,
# d'où la toleration. Et le filtre de nœuds est une `nodeAffinity` sur
# `inference-tier: Exists`, PAS un `nodeSelector` :
#   · un `nodeSelector` teste l'ÉGALITÉ, donc `inference-tier: floor`
#     exclurait les nœuds de débordement — la réplique 2 ne démarrerait jamais ;
#   · `managed-by: peeks` est porté AUSSI par `general-purpose-peeks`, un pool
#     CPU : le pod y atterrirait sans GPU.
# C'est la même leçon que celle du DaemonSet DCGM, où une toleration avait été
# prise pour un filtre : une toleration AUTORISE, elle ne RESTREINT pas.
#
# ═══ RÉPLIQUES ET GITOPS ═════════════════════════════════════════════════════
# `replicas: 1` n'est qu'une valeur de départ : le ScaledObject la reprend dès
# qu'il est actif. Si ce Deployment est un jour livré par une Application Argo
# CD, cette Application DEVRA porter
#   ignoreDifferences: [{group: apps, kind: Deployment, jsonPointers: [/spec/replicas]}]
# sans quoi Argo CD et la HPA se disputeront le champ en boucle.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral
  namespace: vllm
  labels:
    app.kubernetes.io/name: vllm-mistral
    managed-by: peeks
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-mistral
  strategy:
    # Recreate et non RollingUpdate : il n'y a qu'un GPU par nœud, donc un
    # pod neuf ne peut pas coexister avec l'ancien sur le même nœud. Un
    # RollingUpdate resterait Pending en attendant un GPU libre.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-mistral
        managed-by: peeks
      annotations:
        # ═══════════════════════════════════════════════════════════════════
        # 🔑 C'EST CETTE PAIRE D'ANNOTATIONS QUI REND LA DÉMO POSSIBLE.
        #
        # Sans elle, AUCUNE série `vllm:*` n'atteint AMP, et le ScaledObject
        # reste aveugle. Mesuré le 2026-11-06 : le préfixe `vllm:` rend 0 nom
        # dans AMP, sur 1099 noms de séries présents.
        #
        # La cause n'est pas une absence de charge, c'est une absence de
        # chemin : le seul job de découverte PAR PORT,
        # `polyglot_app_config`, ne garde que `:8080` ; et vLLM expose
        # `/metrics` sur `:8000`. Le job `kubernetes-pods`, lui, garde tout
        # pod portant `prometheus.io/scrape` — d'où ces deux lignes.
        #
        # C'est aussi pourquoi le ray-service ne remonte rien : ses pods ne
        # portent que des annotations `argocd.argoproj.io/tracking-id`. Ce
        # Deployment-ci corrige le problème POUR LUI SEUL ; le ray-service
        # reste un sujet distinct, dans appmod.
        # ═══════════════════════════════════════════════════════════════════
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # Un pod par nœud : chaque réplique prend le GPU entier. Cette contrainte
      # rend la mise à l'échelle des pods ET celle des nœuds observables
      # ensemble, ce qui est l'objet de la démonstration.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # ═══════════════════════════════════════════════════════
                  # `In [floor, burst]` ET NON `Exists`.
                  #
                  # `Exists` acceptait les TROIS tiers, y compris `sharded`.
                  # C'est devenu un défaut le jour où le pool de débordement
                  # est passé en spot SEUL, sans repli : si Karpenter ne
                  # trouve pas de capacité spot pour le débordement, le pool
                  # `sharded` devient sa SEULE façon de satisfaire le pod —
                  # et il lancerait alors un `g6.12xlarge` en ON-DEMAND.
                  #
                  # Ce serait contraire à deux consignes à la fois : pas de
                  # repli on-demand, et pas d'autres types d'instance. Et ce
                  # serait coûteux pour rien : le `g6.12xlarge` porte 4 GPU
                  # (vérifié par `describe-instance-types`, contre 1 pour le
                  # `g6.2xlarge`), alors que le `podAntiAffinity` par
                  # `hostname` n'y placerait qu'UNE réplique. On paierait
                  # quatre GPU pour en utiliser un.
                  #
                  # Énumérer deux valeurs ne ramène PAS le piège du
                  # `nodeSelector` : celui-ci teste l'égalité sur une seule
                  # valeur, alors qu'`In` accepte un ensemble. Les deux
                  # tiers voulus restent donc couverts.
                  #
                  # Si le tier `sharded` devait un jour servir, c'est ICI
                  # qu'il faudrait l'ajouter — explicitement, et non par
                  # l'effet de bord d'un `Exists`.
                  # ═══════════════════════════════════════════════════════
                  - key: inference-tier
                    operator: In
                    values:
                      - floor
                      - burst
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vllm-mistral
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          imagePullPolicy: IfNotPresent
          # Tous les drapeaux ci-dessous ont été vérifiés PRÉSENTS au tag
          # v0.10.2 (01efc7ef), avec leur fichier:ligne — aucun n'est supposé.
          args:
            - --model
            - mistralai/Mistral-7B-Instruct-v0.3   # arg_utils.py
            - --served-model-name
            - mistral-7b                           # arg_utils.py:547
            - --host
            - 0.0.0.0                              # api_server.py:150
            - --port
            - "8000"
            - --max-model-len
            - "8192"                               # arg_utils.py:526
            - --max-num-seqs
            - "4"                                  # arg_utils.py:854
            - --gpu-memory-utilization
            - "0.90"                               # arg_utils.py:742
            - --enable-prefix-caching
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_HOME
              value: /cache/huggingface
            # Pas de jeton : le modèle n'est pas gated. Aucune variable
            # HF_TOKEN n'est posée, et aucun secret n'est monté.
            - name: VLLM_LOGGING_LEVEL
              value: INFO
          resources:
            limits:
              # Ressource étendue, fournie par le plugin de périphérique de
              # l'AMI GPU d'EKS Auto Mode. ⚠️ NON VÉRIFIÉE sur ce cluster :
              # aucun nœud GPU n'est démarré, donc `nvidia.com/gpu` n'apparaît
              # dans l'allocatable d'aucun nœud. Cette absence est ATTENDUE et
              # n'est donc pas concluante — à confirmer au premier nœud.
              nvidia.com/gpu: "1"
              memory: 24Gi
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
          # Le démarrage est LONG : 11,5 Go d'image puis ~15 Go de poids.
          # Une startupProbe généreuse évite que kubelet tue le pod avant
          # qu'il ait pu servir. 150 × 10 s = 25 min de tolérance, au-delà de
          # ce qu'on attend, pour que le test MESURE le temps réel au lieu de
          # buter sur une limite que nous aurions fixée.
          startupProbe:
            httpGet:
              path: /health          # api_server.py:447
              port: http
            periodSeconds: 10
            failureThreshold: 150
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        # Cache des poids. emptyDir : chaque réplique télécharge les ~15 Go
        # pour elle-même. Les 100 Gio de disque éphémère de la NodeClass
        # `gpu-reserved-peeks` suffisent largement.
        - name: cache
          emptyDir:
            sizeLimit: 60Gi
        # vLLM utilise la mémoire partagée ; le défaut de 64 Mio de Docker est
        # insuffisant et provoque des échecs opaques.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

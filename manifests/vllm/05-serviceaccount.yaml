# ─────────────────────────────────────────────────────────────────────────────
# ServiceAccount dédié aux pods vLLM — cible de l'association d'identité qui
# leur donne la lecture des poids sur S3.
#
# POURQUOI UN SA DÉDIÉ, ET PAS `default`. Le Deployment ne déclarait AUCUN
# `serviceAccountName` : les pods tournaient donc sous le `default` du
# namespace. Associer le rôle IAM à `default` l'aurait accordé à TOUT pod du
# namespace `vllm`, y compris le pod de charge jetable qu'on y lance pendant
# les tests. Un SA dédié limite l'identité aux seuls pods d'inférence.
#
# AUCUNE ANNOTATION `eks.amazonaws.com/role-arn` ICI, et c'est volontaire :
# c'est le mécanisme IRSA, pas Pod Identity. Avec Pod Identity l'association
# vit côté EKS (voir ../aws-accel/31-pia-vllm-s3.yaml) et le jeton est injecté
# par l'agent — rien à annoter, et surtout aucun ARN IAM à écrire dans ce
# dépôt public, puisqu'un ARN IAM porte le numéro de compte.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-s3-reader
  namespace: vllm
  labels:
    managed-by: peeks
  annotations:
    argocd.argoproj.io/sync-wave: "1"

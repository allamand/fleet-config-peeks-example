# Source: appmod-blueprints gitops/overlays/environments/prod/enabled-addons.yaml (verbatim copy below this header)
# Layer: CORE / agent-free. Read by the fleet-secrets appset at the $values slot (basepath 'gitops/')
# for every spoke whose member file sets labels.environment: prod, on every hub that
# uses this repo as fleetRepo. Not read by hub-fleet-secret (hubs read control-plane only).
enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  cert_manager: true
  # Security
  kyverno: true
  kyverno_policies: true
  kyverno_policy_reporter: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  kubevela: true
  argo_rollouts: true
  # Platform
  platform_manifests_bootstrap: true
  crossplane: true
  kro_manifests: true

# Fleet member registration for the KRO spoke "dev".
#
# The fleet-secrets ApplicationSet (gitops/bootstrap/fleet-secrets.yaml) globs
# fleet/members/*/values.yaml and renders the fleet-secret chart. KRO spokes use
# "externalSecret" mode: the EksclusterWithVpc RGD writes <cluster>/config to AWS
# Secrets Manager (live aws_vpc_id, eks_oidc_issuer, ...), and the chart's
# ExternalSecret builds the ArgoCD cluster-registration Secret from it.
#
# `labels` drive the enabled-addons overlay tier (tenant/environment).
clusterName: dev
mode: externalSecret
externalSecret:
  enabled: true
labels:
  environment: dev
  tenant: default

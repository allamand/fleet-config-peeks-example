# KRO-managed spoke cluster provisioning values (tenant: default).
#
# Clusters here are provisioned via the KRO ResourceGraphDefinition
# (EksclusterWithVpc) + ACK, driven by the `clusters-kro` ApplicationSet
# (gitops/bootstrap/clusters-kro.yaml). The appset globs
#   fleet/spoke-values/tenants/*/kro-clusters/clusters/*.json
# for one trigger file PER cluster, then reads the per-cluster spec from THIS
# file (its `valueFiles` entry resolves the tenant from the JSON path).
#
# ZERO-PAT NOTE: these two spokes are PRE-COMMITTED directly in this public
# repo. ArgoCD reads the public repo read-only, sees dev.json + prod.json and
# this values.yaml, and reconciles both spokes. No write credential / PAT is
# needed for this path. A PAT is only required if you instead let the installer
# task `spokes:apply` GENERATE and PUSH these files at install time (Case B in
# the README).
#
# accountId / managementAccountId are DELIBERATELY OMITTED: the kro-clusters
# chart defaults both to global.accountId, which the clusters-kro appset
# propagates from the hub cluster-secret's real AWS account annotation at
# reconcile time. That keeps a real 12-digit account number OUT of this public
# repo. Same reasoning for domainName (inherited / per-env) and any ARNs.

clusters:
  prod:
    clusterName: prod
    tenant: default
    environment: prod
    provider: kro-ack
    fleetMember: spoke
    region: us-west-2
    k8sVersion: "1.31"
    enableGeneralPurposeNodePool: true
    # Distinct /16 from dev and from the hub.
    cidr:
      vpcCidr: "10.2.0.0/16"
      publicSubnet1Cidr: "10.2.1.0/24"
      publicSubnet2Cidr: "10.2.2.0/24"
      privateSubnet1Cidr: "10.2.11.0/24"
      privateSubnet2Cidr: "10.2.12.0/24"

  # --- Prefixed per-hub dev spokes (multi-hub fleet) ---
  # Both entries live in this ONE shared values.yaml; the clusters-kro chart gates
  # `eq $name global.targetCluster`, and targetCluster = the trigger's clusterName.
  # Because each hub discovers only its OWN trigger (resource_prefix sub-dir), peeks-a-hub
  # activates ONLY peeks-a-dev and peeks-b-hub ONLY peeks-b-dev — no collision.
  # peeks-a-dev inherits the old single "dev" CIDR (10.1.0.0/16).
  peeks-a-dev:
    clusterName: peeks-a-dev
    tenant: default
    environment: dev
    provider: kro-ack
    fleetMember: spoke
    region: us-west-2
    k8sVersion: "1.31"
    enableGeneralPurposeNodePool: true
    # Distinct /16 from prod (10.2) and from peeks-b-dev (10.3) and the hub.
    cidr:
      vpcCidr: "10.1.0.0/16"
      publicSubnet1Cidr: "10.1.1.0/24"
      publicSubnet2Cidr: "10.1.2.0/24"
      privateSubnet1Cidr: "10.1.11.0/24"
      privateSubnet2Cidr: "10.1.12.0/24"

  peeks-b-dev:
    clusterName: peeks-b-dev
    tenant: default
    environment: dev
    provider: kro-ack
    fleetMember: spoke
    region: us-west-2
    k8sVersion: "1.31"
    enableGeneralPurposeNodePool: true
    # Distinct /16 from prod (10.2) and from peeks-a-dev (10.1) and the hub.
    cidr:
      vpcCidr: "10.3.0.0/16"
      publicSubnet1Cidr: "10.3.1.0/24"
      publicSubnet2Cidr: "10.3.2.0/24"
      privateSubnet1Cidr: "10.3.11.0/24"
      privateSubnet2Cidr: "10.3.12.0/24"

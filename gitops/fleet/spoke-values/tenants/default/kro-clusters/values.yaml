# KRO-managed spoke cluster provisioning values (tenant: default).
#
# Clusters here are provisioned via the KRO ResourceGraphDefinition
# (EksclusterWithVpc) + ACK, driven by the `clusters-kro` ApplicationSet
# (gitops/bootstrap/clusters-kro.yaml). The appset globs one trigger file PER
# cluster, then reads the per-cluster spec from THIS file (its `valueFiles` entry
# resolves the tenant from the JSON path):
#   - single hub (default):            fleet/spoke-values/tenants/*/kro-clusters/clusters/*.json
#   - several hubs sharing this repo:  fleet/spoke-values/tenants/*/kro-clusters/clusters/<resource_prefix>/*.json
#     (hub cluster-secret annotation fleet_scope_by_prefix: "true")
#
# This repo uses the multi-hub layout: each hub (resource_prefix peeks-a / peeks-b)
# owns the triggers under clusters/<resource_prefix>/ and discovers only those.
# Both entries below live in this ONE shared file; the kro-clusters chart renders
# only the entry whose name equals global.targetCluster (the trigger's clusterName),
# so each hub activates only its own spoke.
#
# ZERO-PAT NOTE: these spokes are PRE-COMMITTED directly in this public repo.
# ArgoCD reads the public repo read-only, sees the trigger JSONs and this
# values.yaml, and reconciles the spokes. No write credential / PAT is needed
# for this path. A PAT is only required if you instead let the installer task
# `spokes:apply` GENERATE and PUSH these files at install time (Case B in the
# README).
#
# accountId / managementAccountId are DELIBERATELY OMITTED: the kro-clusters
# chart defaults both to global.accountId, which the clusters-kro appset
# propagates from the hub cluster-secret's real AWS account annotation at
# reconcile time. That keeps a real 12-digit account number OUT of this public
# repo. Same reasoning for domainName (inherited / per-env) and any ARNs.

clusters:
  peeks-a-dev:
    clusterName: peeks-a-dev
    tenant: default
    environment: dev
    provider: kro-ack
    fleetMember: spoke
    region: us-west-2
    k8sVersion: "1.31"
    enableGeneralPurposeNodePool: true
    # Distinct /16 from peeks-b-dev (10.3) and from the hubs.
    cidr:
      vpcCidr: "10.1.0.0/16"
      publicSubnet1Cidr: "10.1.1.0/24"
      publicSubnet2Cidr: "10.1.2.0/24"
      privateSubnet1Cidr: "10.1.11.0/24"
      privateSubnet2Cidr: "10.1.12.0/24"

  peeks-b-dev:
    clusterName: peeks-b-dev
    tenant: default
    environment: dev
    provider: kro-ack
    fleetMember: spoke
    region: us-west-2
    k8sVersion: "1.31"
    enableGeneralPurposeNodePool: true
    # Distinct /16 from peeks-a-dev (10.1) and from the hubs.
    cidr:
      vpcCidr: "10.3.0.0/16"
      publicSubnet1Cidr: "10.3.1.0/24"
      publicSubnet2Cidr: "10.3.2.0/24"
      privateSubnet1Cidr: "10.3.11.0/24"
      privateSubnet2Cidr: "10.3.12.0/24"
